name: Build and publish Docker image

# Manual, on-demand image builds for any branch.
# Automatic master builds are owned by release.yaml, which also versions the
# image and publishes :latest — leaving master out here avoids two workflows
# racing to overwrite the same tags.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Required for the linux/arm64 build below; buildx on its own cannot
      # emulate a foreign architecture.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          # Derive the image from the repository running the workflow so this
          # works unchanged on a fork. GHCR requires a lowercase path.
          IMAGE="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          SAFE_REF=$(echo "${{ github.ref_name }}" | tr '/' '-')
          TAGS="$IMAGE:${{ github.sha }}"
          TAGS="$TAGS,$IMAGE:${SAFE_REF}"
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
