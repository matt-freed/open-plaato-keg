<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tap List - Open Plaato</title>
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/tiles.css">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/site-header.css">
  <script src="/site-header.js"></script>
  <script src="/common.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { background: var(--bg); }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--taplist-body-font, var(--sans));
      -webkit-font-smoothing: antialiased;
    }

    main { padding: 0.25rem clamp(1rem, 3vw, 2.5rem) 2.5rem; }

    .status {
      text-align: center;
      padding: 5rem 1rem;
      color: var(--muted);
      font-size: 1.1rem;
    }
    .status a { color: var(--text); }
    .status:empty { display: none; }

  </style>
</head>
<body>

  <site-header heading="Tap List"></site-header>

  <main>
    <p class="status" id="status">Loading taps…</p>
    <div class="grid" id="grid"></div>
    <section class="empty-section" id="emptySection" hidden>
      <h2 class="empty-section-heading">Empty</h2>
      <div class="grid" id="emptyGrid"></div>
    </section>
  </main>

  <script src="/beer-color.js"></script>
  <script src="/keg-graphic.js"></script>
  <script src="/tile-menu.js"></script>
  <script src="/tile-gestures.js"></script>
  <script src="/live.js"></script>
  <script>
    'use strict';

    const grid = document.getElementById('grid');
    const emptyGrid = document.getElementById('emptyGrid');
    const emptySection = document.getElementById('emptySection');
    const statusEl = document.getElementById('status');

    let taps = [];
    const kegs = {};
    // Which figure each keg graphic shows large: one setting for every scale,
    // chosen on Dashboard Setup.
    let amountDisplay = 'amount';

    // ── Formatting ─────────────────────────────────
    const UNIT_LABELS = { litre: 'L' };

    function num(v, digits) {
      return Number.isFinite(v) ? v.toFixed(digits) : null;
    }

    // roundTemp rounds a temperature to a whole degree. Adding 0 turns the -0
    // that Math.round gives for readings just below zero into 0, so it does not
    // display as "-0".
    function roundTemp(v) {
      return Number.isFinite(v) ? Math.round(v) + 0 : v;
    }

    const DAY_MS = 24 * 60 * 60 * 1000;

    // parseIsoDate reads a tap's kegged date, which the server always stores
    // as YYYY-MM-DD, as local midnight. new Date('2026-09-03') would read it
    // as UTC, a day early anywhere west of Greenwich.
    function parseIsoDate(text) {
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(text || '');
      return m ? new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])) : null;
    }

    // kegAge describes how long ago a tap was kegged, as the reading's value
    // and label, or null when it has no kegged date.
    function kegAge(text) {
      const date = parseIsoDate(text);
      if (!date) return null;

      const now = new Date();
      // Counted in calendar days, via UTC so a daylight-saving change cannot
      // make a day 23 or 25 hours long.
      const days = Math.round(
        (Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) -
         Date.UTC(date.getFullYear(), date.getMonth(), date.getDate())) / DAY_MS);

      // The year only matters for a date long enough ago to be ambiguous; left
      // off otherwise, it keeps a December keg read in January to "Dec 20"
      // and the label short enough to share the row.
      const opts = { month: 'short', day: 'numeric' };
      if (Math.abs(days) > 180) opts.year = 'numeric';
      const label = 'Kegged ' + date.toLocaleDateString([], opts);

      let value;
      if (days === 0) value = 'Today';
      else if (days > 0) value = days === 1 ? '1 day' : `${days} days`;
      else value = days === -1 ? 'in 1 day' : `in ${-days} days`;
      return { value, label };
    }

    function trimNum(v) {
      // ABV and IBU are entered by hand; show them as typed, without a
      // trailing ".0".
      return Number.isFinite(v) ? String(Math.round(v * 10) / 10) : null;
    }

    // ── Tiles ──────────────────────────────────────
    function createTile(tap) {
      const tile = document.createElement('article');
      tile.className = 'tile';
      tile.dataset.tapId = tap.id;
      tile.innerHTML = `
        <div class="tile-info">
          <div class="tile-meta">
            <span class="keg-name"></span>
            <span class="pouring">Pouring</span>
            <span class="empty">Empty</span>
          </div>
          <h2 class="beer"></h2>
          <div class="specs"></div>
          <p class="desc"></p>
          <div class="readings"></div>
        </div>
        <div class="tile-keg">
          ${kegSvg()}
          <span class="keg-amount"></span>
        </div>`;
      return tile;
    }

    // updateTile rewrites a tile in place, so the liquid level animates and
    // a tile being dragged is not replaced under the pointer.
    function updateTile(tile, tap, keg) {
      tile.style.setProperty('--accent', beerColor(tap));
      tile.classList.toggle('is-clear', isClear(tap));

      // Readings arrive converted into the chosen display units; the raw
      // fields are only a fallback for a keg that has no display block.
      const d = keg?.display ?? {};
      const amount = d.amount_left ?? keg?.amount_left ?? null;
      const rawUnit = d.amount_unit ?? keg?.beer_left_unit ?? '';
      const unit = UNIT_LABELS[rawUnit] ?? rawUnit;
      const temp = d.keg_temperature ?? keg?.keg_temperature ?? null;
      const tempUnit = d.temperature_unit ?? keg?.temperature_unit ?? '';
      const rawPct = keg?.percent_of_beer_left;
      // A tap with no keg linked has no level to show, so it is drawn full,
      // which shows off the beer's colour.
      const pct = !tap.keg_id ? 100
        : Number.isFinite(rawPct) ? Math.max(0, Math.min(100, rawPct)) : null;

      tile.classList.toggle('is-pouring', keg?.is_pouring === true);
      tile.classList.toggle('is-empty', isKegEmpty(keg));

      tile.querySelector('.keg-name').textContent =
        keg ? kegName(keg, Object.keys(kegs).indexOf(keg.id)) : '';
      tile.querySelector('.beer').textContent = tap.name || 'Unnamed beer';

      const specs = [
        tap.style && `<span class="style">${esc(tap.style)}</span>`,
        trimNum(tap.abv) && `<span>${trimNum(tap.abv)}% ABV</span>`,
        trimNum(tap.ibu) && `<span>${trimNum(tap.ibu)} IBU</span>`,
      ].filter(Boolean).join('');
      tile.querySelector('.specs').innerHTML = specs;

      const desc = tile.querySelector('.desc');
      desc.textContent = tap.description || '';
      desc.title = tap.description || '';

      // A tap with no keg linked shows no temperature at all, so the kegged
      // date moves into its place.
      let readings = '';
      if (tap.keg_id && !keg) {
        readings = '<span class="no-keg">Waiting for the keg scale…</span>';
      } else if (keg) {
        readings = `
          <div class="reading temp">
            <span class="reading-value">${num(roundTemp(temp), 0) ?? '—'}<small>${esc(tempUnit)}</small></span>
            <span class="reading-label">Temp</span>
          </div>`;
      }
      // The kegged date belongs to the tap, so it shows with or without a keg.
      const age = kegAge(tap.kegged_date);
      if (age) {
        readings += `
          <div class="reading age">
            <span class="reading-value">${esc(age.value)}</span>
            <span class="reading-label">${esc(age.label)}</span>
          </div>`;
      }
      tile.querySelector('.readings').innerHTML = readings;

      // A CO₂ cylinder always shows its amount, as it does on the Kegs page.
      const showPercent = amountDisplay === 'percent' && keg?.keg_mode !== 2;
      tile.querySelector('.keg-amount').innerHTML = !keg ? ''
        : showPercent ? `${num(Number.isFinite(rawPct) ? pct : null, 1) ?? '—'}<small>%</small>`
        : `${num(amount, 2) ?? '—'}<small>${esc(unit)}</small>`;
      tile.querySelector('.liquid').style.transform = kegLevelTransform(pct);
    }

    function render() {
      // Rebuilding mid-drag would pull the tile out from under the pointer;
      // the drop renders instead.
      if (gestures.active) { renderPending = true; return; }

      if (!taps.length) {
        showBeerCount(0);
        grid.replaceChildren();
        emptyGrid.replaceChildren();
        emptySection.hidden = true;
        statusEl.innerHTML =
          'Nothing on tap yet. Add taps in <a href="/taplist-setup.html">Tap Setup</a>.';
        return;
      }
      statusEl.textContent = '';

      const existing = new Map([...grid.children, ...emptyGrid.children].map(t => [t.dataset.tapId, t]));
      const full = [], empty = [];
      for (const tap of taps) {
        const tile = existing.get(tap.id) ?? createTile(tap);
        existing.delete(tap.id);
        updateTile(tile, tap, kegs[tap.keg_id]);
        (tile.classList.contains('is-empty') ? empty : full).push(tile);
      }
      existing.forEach(t => t.remove());

      placeTiles(grid, full);
      placeTiles(emptyGrid, empty);
      emptySection.hidden = !empty.length;
      showBeerCount(full.length);
    }

    // The count beside the title is the beers that can be poured, so taps in
    // the Empty section are left out. A keg emptying or being refilled moves
    // its tile between sections, which re-renders, so the count follows.
    function showBeerCount(n) {
      document.querySelector('site-header').count = n ? `${n} ${n === 1 ? 'beer' : 'beers'}` : '';
    }

    // placeTiles puts tiles into a grid in order. Only nodes whose position
    // changed are moved; appending every tile would restart their transitions.
    function placeTiles(container, tiles) {
      tiles.forEach((tile, i) => {
        if (container.children[i] !== tile) container.insertBefore(tile, container.children[i] ?? null);
      });
      while (container.children.length > tiles.length) container.lastElementChild.remove();
    }

    function updateKegTiles(kegId) {
      if (gestures.active) { renderPending = true; return; }
      for (const tap of taps) {
        if (tap.keg_id !== kegId) continue;
        const tile = document.querySelector(`.tile[data-tap-id="${CSS.escape(tap.id)}"]`);
        if (!tile) continue;
        updateTile(tile, tap, kegs[kegId]);
        // A keg that empties or is refilled changes section.
        if (tile.classList.contains('is-empty') !== (tile.parentElement === emptyGrid)) {
          render();
          return;
        }
      }
    }

    // ── Drag to rearrange, and the tile menu ──────
    // Only tiles in the main grid can be dragged; empty ones keep their place.
    // A tap whose keg has not loaded has no keg to link to yet.
    let renderPending = false;
    const gestures = attachTileGestures({
      root: document.querySelector('main'),
      grid,
      idOf: tile => tile.dataset.tapId,
      menuFor: tile => {
        const tap = taps.find(t => t.id === tile.dataset.tapId);
        return tap && { tapId: tap.id, kegId: kegs[tap.keg_id] ? tap.keg_id : null };
      },
      onReorder: order => saveOrder(keepEmptyInPlace(taps.map(t => t.id), order)),
      onEnd: () => {
        if (renderPending) {
          renderPending = false;
          render();
        }
      },
    });

    async function saveOrder(order) {
      const byId = new Map(taps.map(t => [t.id, t]));
      taps = order.map(id => byId.get(id)).filter(Boolean);
      try {
        await api('PUT', '/api/taps/order', { ordered_ids: order });
      } catch (_) {
        // Fall back to whatever the server has.
        loadAll();
      }
    }

    // ── Data ───────────────────────────────────────
    // A failed read keeps the current choice rather than flipping every tile.
    async function loadAmountDisplay() {
      try {
        amountDisplay = (await api('GET', '/api/config')).amount_display || 'amount';
      } catch (_) {}
    }

    async function loadAll() {
      try {
        const settings = loadAmountDisplay();
        const [nextTaps, kegList] = await Promise.all([api('GET', '/api/taps'), api('GET', '/api/kegs')]);
        taps = nextTaps;
        for (const id in kegs) delete kegs[id];
        for (const k of kegList) kegs[k.id] = k;
        await settings;
        render();
      } catch (_) {
        if (!taps.length) statusEl.textContent = 'Could not load the tap list. Is the server running?';
      }
    }

    loadAll();
    setInterval(() => { if (!gestures.active) loadAll(); }, 60000);
    liveUpdates(msg => {
      if (msg.type === 'keg_removed') {
        delete kegs[msg.id];
        updateKegTiles(msg.id);
      } else if (msg.type === 'keg' && msg.data?.id) {
        kegs[msg.data.id] = msg.data;
        updateKegTiles(msg.data.id);
      }
    });
  </script>
</body>
</html>
