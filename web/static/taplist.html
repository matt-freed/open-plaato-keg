<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tap List</title>
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/tiles.css">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/site-header.css">
  <script src="/site-header.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { background: var(--bg); }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--taplist-body-font, var(--sans));
      -webkit-font-smoothing: antialiased;
    }

    main { padding: 0.25rem clamp(1rem, 3vw, 2.5rem) 2.5rem; }

    .status {
      text-align: center;
      padding: 5rem 1rem;
      color: var(--muted);
      font-size: 1.1rem;
    }
    .status a { color: var(--text); }
    .status:empty { display: none; }

    .tile.dragging {
      cursor: grabbing;
      pointer-events: none;
      z-index: 1000;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      border-color: rgba(255, 255, 255, 0.18);
    }
    .tile-placeholder {
      border: 2px dashed rgba(255, 255, 255, 0.12);
      border-radius: var(--radius);
    }
    body.is-dragging { cursor: grabbing; }
  </style>
</head>
<body>

  <site-header heading="On Tap"></site-header>

  <main>
    <p class="status" id="status">Loading taps…</p>
    <div class="grid" id="grid"></div>
  </main>

  <script src="/beer-color.js"></script>
  <script src="/keg-graphic.js"></script>
  <script>
    'use strict';

    const grid = document.getElementById('grid');
    const statusEl = document.getElementById('status');

    let taps = [];
    const kegs = {};
    // Which figure each keg graphic shows large: one setting for every scale,
    // chosen on Dashboard Setup.
    let amountDisplay = 'amount';

    // ── Formatting ─────────────────────────────────
    const UNIT_LABELS = { litre: 'L' };

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    }

    function num(v, digits) {
      return Number.isFinite(v) ? v.toFixed(digits) : null;
    }

    // roundTemp rounds a temperature to a whole degree. Adding 0 turns the -0
    // that Math.round gives for readings just below zero into 0, so it does not
    // display as "-0".
    function roundTemp(v) {
      return Number.isFinite(v) ? Math.round(v) + 0 : v;
    }

    const DAY_MS = 24 * 60 * 60 * 1000;

    // parseIsoDate reads a tap's kegged date, which the server always stores
    // as YYYY-MM-DD, as local midnight. new Date('2026-09-03') would read it
    // as UTC, a day early anywhere west of Greenwich.
    function parseIsoDate(text) {
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(text || '');
      return m ? new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])) : null;
    }

    // kegAge describes how long ago a tap was kegged, as the reading's value
    // and label, or null when it has no kegged date.
    function kegAge(text) {
      const date = parseIsoDate(text);
      if (!date) return null;

      const now = new Date();
      // Counted in calendar days, via UTC so a daylight-saving change cannot
      // make a day 23 or 25 hours long.
      const days = Math.round(
        (Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) -
         Date.UTC(date.getFullYear(), date.getMonth(), date.getDate())) / DAY_MS);

      // The year only matters for a date long enough ago to be ambiguous; left
      // off otherwise, it keeps a December keg read in January to "Dec 20"
      // and the label short enough to share the row.
      const opts = { month: 'short', day: 'numeric' };
      if (Math.abs(days) > 180) opts.year = 'numeric';
      const label = 'Kegged ' + date.toLocaleDateString([], opts);

      let value;
      if (days === 0) value = 'Today';
      else if (days > 0) value = days === 1 ? '1 day' : `${days} days`;
      else value = days === -1 ? 'in 1 day' : `in ${-days} days`;
      return { value, label };
    }

    function trimNum(v) {
      // ABV and IBU are entered by hand; show them as typed, without a
      // trailing ".0".
      return Number.isFinite(v) ? String(Math.round(v * 10) / 10) : null;
    }

    // ── Tiles ──────────────────────────────────────
    function createTile(tap) {
      const tile = document.createElement('article');
      tile.className = 'tile';
      tile.dataset.tapId = tap.id;
      tile.innerHTML = `
        <div class="tile-info">
          <div class="tile-meta">
            <span class="keg-name"></span>
            <span class="pouring">Pouring</span>
          </div>
          <h2 class="beer"></h2>
          <div class="specs"></div>
          <p class="desc"></p>
          <div class="readings"></div>
        </div>
        <div class="tile-keg">
          ${kegSvg()}
          <span class="keg-amount"></span>
        </div>`;
      return tile;
    }

    // updateTile rewrites a tile in place, so the liquid level animates and
    // a tile being dragged is not replaced under the pointer.
    function updateTile(tile, tap, keg) {
      tile.style.setProperty('--accent', beerColor(tap));
      tile.classList.toggle('is-clear', isClear(tap));

      // Readings arrive converted into the chosen display units; the raw
      // fields are only a fallback for a keg that has no display block.
      const d = keg?.display ?? {};
      const amount = d.amount_left ?? keg?.amount_left ?? null;
      const rawUnit = d.amount_unit ?? keg?.beer_left_unit ?? '';
      const unit = UNIT_LABELS[rawUnit] ?? rawUnit;
      const temp = d.keg_temperature ?? keg?.keg_temperature ?? null;
      const tempUnit = d.temperature_unit ?? keg?.temperature_unit ?? '';
      const rawPct = keg?.percent_of_beer_left;
      // A tap with no keg linked has no level to show, so it is drawn full,
      // which shows off the beer's colour.
      const pct = !tap.keg_id ? 100
        : Number.isFinite(rawPct) ? Math.max(0, Math.min(100, rawPct)) : null;

      tile.classList.toggle('is-pouring', keg?.is_pouring === true);

      tile.querySelector('.keg-name').textContent =
        keg ? (keg.label || 'Keg ' + keg.id.slice(0, 6)) : '';
      tile.querySelector('.beer').textContent = tap.name || 'Unnamed beer';

      const specs = [
        tap.style && `<span class="style">${esc(tap.style)}</span>`,
        trimNum(tap.abv) && `<span>${trimNum(tap.abv)}% ABV</span>`,
        trimNum(tap.ibu) && `<span>${trimNum(tap.ibu)} IBU</span>`,
      ].filter(Boolean).join('');
      tile.querySelector('.specs').innerHTML = specs;

      const desc = tile.querySelector('.desc');
      desc.textContent = tap.description || '';
      desc.title = tap.description || '';

      // A tap with no keg linked shows no temperature at all, so the kegged
      // date moves into its place.
      let readings = '';
      if (tap.keg_id && !keg) {
        readings = '<span class="no-keg">Waiting for the scale…</span>';
      } else if (keg) {
        readings = `
          <div class="reading temp">
            <span class="reading-value">${num(roundTemp(temp), 0) ?? '—'}<small>${esc(tempUnit)}</small></span>
            <span class="reading-label">Temp</span>
          </div>`;
      }
      // The kegged date belongs to the tap, so it shows with or without a keg.
      const age = kegAge(tap.kegged_date);
      if (age) {
        readings += `
          <div class="reading age">
            <span class="reading-value">${esc(age.value)}</span>
            <span class="reading-label">${esc(age.label)}</span>
          </div>`;
      }
      tile.querySelector('.readings').innerHTML = readings;

      // A CO₂ cylinder always shows its amount, as it does on the Kegs page.
      const showPercent = amountDisplay === 'percent' && keg?.keg_mode !== 2;
      tile.querySelector('.keg-amount').innerHTML = !keg ? ''
        : showPercent ? `${num(Number.isFinite(rawPct) ? pct : null, 1) ?? '—'}<small>%</small>`
        : `${num(amount, 2) ?? '—'}<small>${esc(unit)}</small>`;
      tile.querySelector('.liquid').style.transform = kegLevelTransform(pct);
    }

    function render() {
      // Rebuilding mid-drag would pull the tile out from under the pointer;
      // the drop renders instead.
      if (drag) { renderPending = true; return; }

      document.querySelector('site-header').count =
        taps.length ? `${taps.length} ${taps.length === 1 ? 'beer' : 'beers'}` : '';

      if (!taps.length) {
        grid.replaceChildren();
        statusEl.innerHTML =
          'Nothing on tap yet. Add taps in <a href="/taplist-setup.html">Tap Setup</a>.';
        return;
      }
      statusEl.textContent = '';

      const existing = new Map([...grid.children].map(t => [t.dataset.tapId, t]));
      const ordered = taps.map(tap => {
        const tile = existing.get(tap.id) ?? createTile(tap);
        existing.delete(tap.id);
        updateTile(tile, tap, kegs[tap.keg_id]);
        return tile;
      });
      existing.forEach(t => t.remove());

      // Only move nodes whose position changed; appending every tile would
      // restart their transitions.
      ordered.forEach((tile, i) => {
        if (grid.children[i] !== tile) grid.insertBefore(tile, grid.children[i] ?? null);
      });
    }

    function updateKegTiles(kegId) {
      if (drag) { renderPending = true; return; }
      for (const tap of taps) {
        if (tap.keg_id !== kegId) continue;
        const tile = grid.querySelector(`.tile[data-tap-id="${CSS.escape(tap.id)}"]`);
        if (tile) updateTile(tile, tap, kegs[kegId]);
      }
    }

    // ── Drag to rearrange ──────────────────────────
    // Pointer events rather than HTML5 drag and drop, which does not work on
    // touch screens. A mouse drags as soon as it moves; a finger has to press
    // and hold first, so the page can still be scrolled.
    const DRAG_THRESHOLD = 6;
    const LONG_PRESS_MS = 350;

    let press = null;
    let drag = null;
    let renderPending = false;

    grid.addEventListener('pointerdown', e => {
      if (e.button !== 0 || drag) return;
      const tile = e.target.closest('.tile');
      if (!tile) return;
      press = { tile, id: e.pointerId, type: e.pointerType, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY };
      if (e.pointerType === 'touch') {
        press.timer = setTimeout(() => {
          if (!press) return;
          navigator.vibrate?.(10);
          startDrag(press);
        }, LONG_PRESS_MS);
      }
    });

    window.addEventListener('pointermove', e => {
      if (drag) {
        if (e.pointerId === drag.id) moveDrag(e.clientX, e.clientY);
        return;
      }
      if (!press || e.pointerId !== press.id) return;
      press.x = e.clientX;
      press.y = e.clientY;
      if (Math.hypot(press.x - press.x0, press.y - press.y0) < DRAG_THRESHOLD) return;
      if (press.type === 'touch') { clearPress(); return; } // the user is scrolling
      startDrag(press);
    });

    window.addEventListener('pointerup', e => {
      if (drag && e.pointerId === drag.id) endDrag(true);
      clearPress();
    });
    window.addEventListener('pointercancel', e => {
      if (drag && e.pointerId === drag.id) endDrag(true);
      clearPress();
    });
    window.addEventListener('keydown', e => {
      if (e.key === 'Escape' && drag) endDrag(false);
    });
    // Once a touch drag has started, stop the browser from scrolling with it.
    document.addEventListener('touchmove', e => { if (drag) e.preventDefault(); }, { passive: false });
    grid.addEventListener('contextmenu', e => { if (press || drag) e.preventDefault(); });

    function clearPress() {
      if (press?.timer) clearTimeout(press.timer);
      press = null;
    }

    function startDrag(p) {
      const { tile } = p;
      clearPress();
      const rect = tile.getBoundingClientRect();

      const placeholder = document.createElement('div');
      placeholder.className = 'tile-placeholder';
      tile.before(placeholder);

      drag = {
        tile, placeholder, id: p.id,
        x0: p.x0, y0: p.y0,
        startOrder: [...grid.children].filter(el => el !== placeholder).map(el => el.dataset.tapId),
        lastX: p.x, lastY: p.y,
        scrollSpeed: 0,
      };

      tile.getAnimations().forEach(a => a.cancel());
      tile.classList.add('dragging');
      document.body.classList.add('is-dragging');
      Object.assign(tile.style, {
        position: 'fixed',
        left: rect.left + 'px',
        top: rect.top + 'px',
        width: rect.width + 'px',
        height: rect.height + 'px',
      });
      moveDrag(p.x, p.y);
    }

    function moveDrag(x, y) {
      drag.lastX = x;
      drag.lastY = y;
      drag.tile.style.transform =
        `translate(${x - drag.x0}px, ${y - drag.y0}px) rotate(1.2deg) scale(1.03)`;

      // Scroll when the pointer nears the top or bottom edge.
      const edge = 70;
      drag.scrollSpeed = y < edge ? -(edge - y) / 4 : y > innerHeight - edge ? (y - innerHeight + edge) / 4 : 0;
      if (drag.scrollSpeed && !drag.scrolling) {
        drag.scrolling = true;
        requestAnimationFrame(autoScroll);
      }

      reposition(x, y);
    }

    function autoScroll() {
      if (!drag || !drag.scrollSpeed) { if (drag) drag.scrolling = false; return; }
      window.scrollBy(0, drag.scrollSpeed);
      reposition(drag.lastX, drag.lastY);
      requestAnimationFrame(autoScroll);
    }

    // reposition moves the placeholder to the slot under the pointer. It hit
    // tests against layout boxes rather than on-screen ones, so tiles that are
    // still sliding into place cannot be hit twice and make the order flicker.
    function reposition(x, y) {
      const g = grid.getBoundingClientRect();
      const tiles = [...grid.querySelectorAll('.tile:not(.dragging)')];
      const over = tiles.find(t => {
        const left = g.left + t.offsetLeft, top = g.top + t.offsetTop;
        return x >= left && x < left + t.offsetWidth && y >= top && y < top + t.offsetHeight;
      });
      if (!over) return;

      const items = [...grid.children];
      const from = items.indexOf(drag.placeholder);
      const to = items.indexOf(over);
      animateLayout(() => {
        if (to > from) over.after(drag.placeholder);
        else over.before(drag.placeholder);
      });
    }

    // animateLayout runs a DOM change and slides every tile from where it was
    // to where it ended up.
    function animateLayout(change) {
      const tiles = [...grid.querySelectorAll('.tile:not(.dragging)')];
      const before = new Map(tiles.map(t => [t, t.getBoundingClientRect()]));
      change();
      for (const t of tiles) {
        t.getAnimations().forEach(a => a.cancel());
        const a = before.get(t), b = t.getBoundingClientRect();
        const dx = a.left - b.left, dy = a.top - b.top;
        if (dx || dy) {
          t.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'none' }],
            { duration: 220, easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)' });
        }
      }
    }

    function endDrag(commit) {
      const { tile, placeholder, startOrder } = drag;

      if (!commit) {
        // Put the placeholder back where the tile started.
        animateLayout(() => {
          const rest = startOrder.filter(id => id !== tile.dataset.tapId);
          const i = startOrder.indexOf(tile.dataset.tapId);
          const next = rest[i] && grid.querySelector(`.tile[data-tap-id="${CSS.escape(rest[i])}"]`);
          grid.insertBefore(placeholder, next || null);
        });
      }

      // Settle the lifted tile into its slot.
      const from = tile.getBoundingClientRect();
      placeholder.replaceWith(tile);
      tile.classList.remove('dragging');
      document.body.classList.remove('is-dragging');
      tile.removeAttribute('style');
      updateTileAccent(tile);
      const to = tile.getBoundingClientRect();
      tile.animate(
        [{ transform: `translate(${from.left - to.left}px, ${from.top - to.top}px) rotate(1.2deg) scale(1.03)` },
         { transform: 'none' }],
        { duration: 240, easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)' });

      drag = null;

      const order = [...grid.children].map(t => t.dataset.tapId);
      if (commit && order.join() !== startOrder.join()) saveOrder(order);

      if (renderPending) {
        renderPending = false;
        render();
      }
    }

    // Clearing the inline style drops the per-tap colour; put it back.
    function updateTileAccent(tile) {
      const tap = taps.find(t => t.id === tile.dataset.tapId);
      if (tap) tile.style.setProperty('--accent', beerColor(tap));
    }

    async function saveOrder(order) {
      const byId = new Map(taps.map(t => [t.id, t]));
      taps = order.map(id => byId.get(id)).filter(Boolean);
      try {
        const res = await fetch('/api/taps/order', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ordered_ids: order }),
        });
        if (!res.ok) throw new Error(res.status);
      } catch (_) {
        // Fall back to whatever the server has.
        loadAll();
      }
    }

    // ── Data ───────────────────────────────────────
    // A failed read keeps the current choice rather than flipping every tile.
    async function loadAmountDisplay() {
      try {
        const res = await fetch('/api/config/amount-display');
        if (res.ok) amountDisplay = (await res.json()).amount_display || 'amount';
      } catch (_) {}
    }

    async function loadAll() {
      try {
        const settings = loadAmountDisplay();
        const [tapsRes, kegsRes] = await Promise.all([fetch('/api/taps'), fetch('/api/kegs')]);
        if (!tapsRes.ok || !kegsRes.ok) throw new Error('bad response');
        const [nextTaps, kegList] = await Promise.all([tapsRes.json(), kegsRes.json()]);
        taps = nextTaps;
        for (const id in kegs) delete kegs[id];
        for (const k of kegList) kegs[k.id] = k;
        await settings;
        render();
      } catch (_) {
        if (!taps.length) statusEl.textContent = 'Could not load the tap list. Is the server running?';
      }
    }

    function connect() {
      const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`);
      ws.addEventListener('message', ev => {
        let msg;
        try { msg = JSON.parse(ev.data); } catch (_) { return; }
        if (msg.type === 'keg_removed') {
          delete kegs[msg.id];
          updateKegTiles(msg.id);
        } else if (msg.type === 'keg' && msg.data?.id) {
          kegs[msg.data.id] = msg.data;
          updateKegTiles(msg.data.id);
        }
      });
      ws.addEventListener('close', () => setTimeout(connect, 5000));
      ws.addEventListener('error', () => ws.close());
    }

    loadAll();
    setInterval(() => { if (!drag) loadAll(); }, 60000);
    connect();
  </script>
</body>
</html>
