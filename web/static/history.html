<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History</title>
    <link rel="stylesheet" href="/tokens.css">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/site-header.css">
    <script src="/site-header.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3"></script>
</head>
<body>
  <site-header heading="History"></site-header>

  <section class="section">
    <div class="container">
      <!-- Controls row -->
      <div class="columns is-vcentered mb-4">
        <div class="column is-narrow">
          <div class="field">
            <label class="label">Device</label>
            <div class="control">
              <div class="select">
                <select id="deviceSelect">
                  <option value="">Loading...</option>
                </select>
              </div>
            </div>
          </div>
        </div>
        <div class="column is-narrow">
          <div class="field">
            <label class="label">Time Range</label>
            <div class="control">
              <div class="buttons has-addons" id="rangeButtons">
                <button class="button" data-range="1h">1h</button>
                <button class="button" data-range="6h">6h</button>
                <button class="button is-selected" data-range="24h">24h</button>
                <button class="button" data-range="7d">7d</button>
                <button class="button" data-range="30d">30d</button>
              </div>
            </div>
          </div>
        </div>
        <div class="column is-narrow">
          <button class="button" id="downloadBtn" title="Download CSV">
            &#8595; Download CSV
          </button>
        </div>
        <div class="column is-narrow">
          <span class="help" id="entryCount"></span>
        </div>
      </div>

      <!-- Chart -->
      <div class="box">
        <div class="empty-state" id="noDataMsg" style="display:none;">
          No data for this device and time range.
        </div>
        <!-- Sized by the page rather than by the chart's aspect ratio, which
             would make a full-width chart taller than the screen. -->
        <div style="position: relative; height: clamp(300px, 55vh, 560px);">
          <canvas id="historyChart"></canvas>
        </div>
      </div>

    </div>
  </section>

  <script>
    // ----------------------------------------------------------------
    // State
    // ----------------------------------------------------------------
    let selectedDevice = null;
    let selectedRange = '24h';
    let chart = null;
    let timeFormat = '12h';
    // Per-keg unit labels for the axes, filled in from /api/kegs. The readings
    // themselves arrive already converted.
    const kegUnits = {};

    fetch('/api/config/time-format')
      .then(r => r.json())
      .then(d => { timeFormat = d.time_format || '12h'; })
      .catch(() => {});


    // ----------------------------------------------------------------
    // Range buttons
    // ----------------------------------------------------------------
    document.querySelectorAll('#rangeButtons button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#rangeButtons button').forEach(b => {
          b.classList.remove('is-selected');
        });
        btn.classList.add('is-selected');
        selectedRange = btn.dataset.range;
        if (selectedDevice) loadChart();
      });
    });

    // ----------------------------------------------------------------
    // Device selector
    // ----------------------------------------------------------------
    document.getElementById('deviceSelect').addEventListener('change', function () {
      selectedDevice = this.value || null;
      if (selectedDevice) loadChart();
    });

    // ----------------------------------------------------------------
    // Download CSV
    // ----------------------------------------------------------------
    document.getElementById('downloadBtn').addEventListener('click', () => {
      if (!selectedDevice) return;
      const url = `/api/kegs/${selectedDevice}/log/csv?range=${selectedRange}`;
      const a = document.createElement('a');
      a.href = url;
      a.download = '';
      a.click();
    });

    // ----------------------------------------------------------------
    // Load devices list
    // ----------------------------------------------------------------
    async function loadDevices() {
      destroyChart();
      document.getElementById('noDataMsg').style.display = 'none';
      document.getElementById('entryCount').textContent = '';

      const sel = document.getElementById('deviceSelect');
      sel.innerHTML = '<option value="">Loading...</option>';
      selectedDevice = null;

      try {
        const r = await fetch('/api/kegs/devices');
        const devices = await r.json();   // array of id strings

        if (!devices || devices.length === 0) {
          sel.innerHTML = '<option value="">No devices found</option>';
          return;
        }

        sel.innerHTML = '<option value="">Select a device</option>';
        {
          // Fetch full keg data to get labels
          const kegsResp = await fetch('/api/kegs');
          const kegsData = await kegsResp.json();
          const labelMap = {};
          kegsData.forEach((k, index) => {
            labelMap[k.id] = k.label || `Scale ${index + 1}`;
            const rawUnit = k.display?.amount_unit || k.beer_left_unit || '';
            kegUnits[k.id] = {
              amount: rawUnit === 'litre' ? 'L' : rawUnit,
              temp: k.display?.temperature_unit || k.temperature_unit || '',
            };
          });

          devices.forEach((id, index) => {
            const opt = document.createElement('option');
            opt.value = id;
            opt.textContent = labelMap[id] || `Scale ${index + 1}`;
            sel.appendChild(opt);
          });
        }

        // Auto-select first
        if (sel.options.length > 1) {
          sel.selectedIndex = 1;
          selectedDevice = sel.value;
          loadChart();
        }
      } catch (e) {
        sel.innerHTML = '<option value="">Error loading devices</option>';
        console.error(e);
      }
    }

    // ----------------------------------------------------------------
    // Load and render chart
    // ----------------------------------------------------------------
    async function loadChart() {
      if (!selectedDevice) return;

      document.getElementById('noDataMsg').style.display = 'none';
      document.getElementById('entryCount').textContent = 'Loading…';

      try {
        const url = `/api/kegs/${selectedDevice}/log?range=${selectedRange}`;
        const r = await fetch(url);
        const entries = await r.json();

        document.getElementById('entryCount').textContent =
          entries.length === 0 ? '' : `${entries.length} data points`;

        if (entries.length === 0) {
          document.getElementById('noDataMsg').style.display = 'block';
          destroyChart();
          return;
        }

        renderChart(entries);
      } catch (e) {
        document.getElementById('entryCount').textContent = 'Error loading data';
        console.error(e);
      }
    }

    // ----------------------------------------------------------------
    // Chart rendering
    // ----------------------------------------------------------------
    function destroyChart() {
      if (chart) { chart.destroy(); chart = null; }
    }

    function renderChart(entries) {
      destroyChart();

      const ctx = document.getElementById('historyChart').getContext('2d');

      // Chart.js draws on a canvas, so it takes the page's colours and font
      // from the shared tokens rather than from CSS.
      const token = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      Chart.defaults.color = token('--muted');
      Chart.defaults.borderColor = 'rgba(255, 255, 255, 0.06)';
      Chart.defaults.font.family = token('--sans');
      const amountColor = token('--action');
      const tempColor = '#8fb3ff';
      const pctColor = token('--pour');
      // The area under the amount line is the same colour, faded. The theme
      // stores colours as #rrggbb, which takes a hex alpha suffix.
      const withAlpha = (hex, a) => /^#[0-9a-f]{6}$/i.test(hex)
        ? hex + Math.round(a * 255).toString(16).padStart(2, '0') : 'transparent';

      // Timestamps are Unix seconds — convert to milliseconds for Chart.js
      const labels = entries.map(e => e.timestamp * 1000);

      let datasets, yScales;

      {
        const amountLeft  = entries.map(e => e.amount_left ?? null);
        const temperature = entries.map(e => e.keg_temperature ?? null);
        const pctLeft     = entries.map(e => e.percent_of_beer_left ?? null);

        const u = kegUnits[selectedDevice] || {};
        const unitLabel = u.amount ? `Amount Left (${u.amount})` : 'Amount Left';
        const tempLabel = u.temp ? `Temperature (${u.temp})` : 'Temperature';

        datasets = [
          {
            label: unitLabel,
            data: amountLeft,
            borderColor: amountColor,
            backgroundColor: withAlpha(amountColor, 0.1),
            fill: true,
            tension: 0.2,
            yAxisID: 'yLeft',
            pointRadius: entries.length > 200 ? 0 : 3,
            spanGaps: true,
          },
          {
            label: tempLabel,
            data: temperature,
            borderColor: tempColor,
            backgroundColor: 'transparent',
            tension: 0.2,
            yAxisID: 'yRight',
            pointRadius: entries.length > 200 ? 0 : 3,
            spanGaps: true,
          },
          {
            label: '% Left',
            data: pctLeft,
            borderColor: pctColor,
            backgroundColor: 'transparent',
            tension: 0.2,
            yAxisID: 'yLeft2',
            pointRadius: 0,
            spanGaps: true,
            hidden: true,
          },
        ];

        yScales = {
          yLeft: {
            type: 'linear',
            position: 'left',
            title: { display: true, text: unitLabel },
          },
          yRight: {
            type: 'linear',
            position: 'right',
            title: { display: true, text: tempLabel },
            grid: { drawOnChartArea: false },
          },
          yLeft2: {
            type: 'linear',
            position: 'left',
            title: { display: true, text: '% Left' },
            display: false,
          },
        };
      }

      chart = new Chart(ctx, {
        type: 'line',
        data: { labels, datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: {
              position: 'top',
              align: 'end',
              labels: { boxWidth: 10, boxHeight: 10, usePointStyle: true, color: token('--soft') },
            },
            tooltip: {
              callbacks: {
                title: items => new Date(items[0].parsed.x).toLocaleString([], { hour12: timeFormat !== '24h' }),
              },
            },
          },
          scales: {
            x: {
              type: 'time',
              time: { tooltipFormat: timeFormat === '24h' ? 'PP HH:mm:ss' : 'PPpp' },
              title: { display: false },
              ticks: { maxTicksLimit: 10 },
            },
            ...yScales,
          },
        },
      });
    }

    // ----------------------------------------------------------------
    // Init
    // ----------------------------------------------------------------
    loadDevices();
  </script>
</body>
</html>
