<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History - Open Plaato</title>
    <link rel="stylesheet" href="/tokens.css">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/site-header.css">
    <script src="/site-header.js"></script>
    <script src="/common.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3"></script>
    <style>
      /* Scale, range and export sit in one row above everything they scope. */
      .controls {
        display: flex; flex-wrap: wrap; align-items: flex-end; gap: 1rem 1.5rem;
        margin-bottom: 1.25rem;
      }
      .controls .field { margin: 0; }
      .controls .buttons.has-addons { flex-wrap: wrap; }
      /* A scale's beer, with the scale's own name beneath it. */
      .scale-option { flex-direction: column; justify-content: center; gap: 0.1rem; line-height: 1.15; }
      .scale-option .scale-name { font-size: 0.72rem; font-weight: 500; color: var(--faint); }
      .scale-option.is-selected .scale-name { color: var(--muted); }
      /* A custom window: start and end on one row, wrapping on a phone. */
      .custom-range-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
      .custom-range-row .input { width: auto; padding: 0.4rem 0.6rem; font-size: 0.88rem; }
      .custom-range .help { margin-top: 0.4rem; }
      .page-actions { display: flex; justify-content: flex-end; gap: 0.5rem; margin-bottom: 0.75rem; }

      /* The range's figures, set like the tap list's readings. */
      .stats {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 1.25rem 1.5rem;
      }
      .stat { display: flex; flex-direction: column; gap: 0.2rem; min-width: 0; }
      .stat-value { font-size: 1.6rem; font-weight: 650; line-height: 1.1; letter-spacing: -0.01em; white-space: nowrap; }
      .stat-value small { margin-left: 0.2rem; font-size: 0.9rem; font-weight: 500; color: var(--muted); letter-spacing: 0; }
      .stat-label {
        font-size: 0.68rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
      }
      .stats-note { margin: 1rem 0 0; }

      .chart-head { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; margin-bottom: 0.75rem; }
      .box > div.chart-head > .title { margin: 0; }
      .chart-toggles { display: flex; gap: 0.5rem; flex-wrap: wrap; }
      .chart-toggles .buttons { margin-bottom: 0; }
      .chart-key { display: flex; gap: 1rem; font-size: 0.8rem; }
      .chart-key span { display: inline-flex; align-items: center; gap: 0.4rem; }
      .key-line { width: 14px; height: 2px; border-radius: 1px; background: var(--action); }
      .key-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pour); }
      /* Sized by the page rather than by an aspect ratio, which would make a
         full-width chart taller than the screen. */
      .chart-wrap { position: relative; height: clamp(240px, 38vh, 420px); }
      .chart-wrap.is-short { height: clamp(150px, 22vh, 240px); }
      /* While a new range loads, the charts keep their last render, faded,
         rather than flashing empty. */
      .is-loading .chart-wrap, .is-loading .stats { opacity: 0.45; transition: opacity 0.15s; }

      /* One readout for both charts, at the hovered time. */
      .chart-tooltip {
        position: fixed; z-index: 60; pointer-events: none;
        min-width: 170px; padding: 0.6rem 0.75rem;
        background: var(--tile-2); border: 1px solid var(--line-strong); border-radius: 12px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
        font-size: 0.82rem;
      }
      .chart-tooltip-time { margin-bottom: 0.35rem; font-size: 0.72rem; color: var(--muted); }
      .chart-tooltip-row { display: flex; align-items: center; gap: 0.5rem; }
      .chart-tooltip-row strong { font-weight: 650; font-variant-numeric: tabular-nums; }
      .chart-tooltip-row .key { width: 12px; height: 2px; border-radius: 1px; flex-shrink: 0; }
      .chart-tooltip-row .key.is-dot { width: 7px; height: 7px; border-radius: 50%; }

      .empty-state .button { margin-top: 1rem; }
      .pours-head { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; margin-bottom: 0.75rem; }
      .box > div.pours-head > .title { margin: 0; }
    </style>
</head>
<body>
  <site-header heading="History"></site-header>

  <section class="section">
    <div class="container is-centered is-wide" id="page">
      <!-- Its own row above the choices, so they never push it to a line of
           its own. It downloads whatever scale and range are chosen. -->
      <div class="page-actions">
        <a class="button is-small" href="/pours.html">All pours &rarr;</a>
        <a class="button is-small" id="editBtn" href="/history-edit.html">Edit</a>
        <button class="button is-small is-danger" type="button" id="clearBtn">Clear history</button>
        <a class="button is-small" id="downloadBtn" href="#" download>&#8595; Download CSV</a>
      </div>

      <div class="controls">
        <div class="field">
          <span class="label">Keg Scale</span>
          <div class="buttons has-addons" id="scaleChoice"></div>
        </div>
        <div class="field">
          <span class="label">Range</span>
          <div class="buttons has-addons" id="rangeChoice">
            <button class="button" type="button" data-value="1h">1 hour</button>
            <button class="button" type="button" data-value="6h">6 hours</button>
            <button class="button" type="button" data-value="24h">24 hours</button>
            <button class="button" type="button" data-value="7d">7 days</button>
            <button class="button" type="button" data-value="30d">30 days</button>
            <button class="button" type="button" data-value="90d">3 months</button>
            <button class="button" type="button" data-value="180d">6 months</button>
            <button class="button" type="button" data-value="1y">1 year</button>
            <button class="button" type="button" data-value="custom">Custom</button>
          </div>
        </div>
        <div class="field custom-range" id="customRange" hidden>
          <span class="label">Custom range</span>
          <form class="custom-range-row" id="customForm" novalidate>
            <input class="input" type="datetime-local" id="customFrom" aria-label="Start">
            <span>to</span>
            <input class="input" type="datetime-local" id="customTo" aria-label="End">
            <button class="button is-primary" type="submit">Apply</button>
          </form>
          <p class="help is-danger" id="customError" hidden></p>
        </div>
      </div>

      <p class="empty-state" id="pageStatus">Loading…</p>

      <div id="results" hidden>
        <div class="box section-box" id="statsBox">
          <h2 class="title is-4" id="statsTitle">Last 24 hours</h2>
          <div class="stats" id="stats"></div>
          <p class="help stats-note" id="statsNote"></p>
        </div>

        <div class="box section-box" id="noData" hidden>
          <p class="empty-state" id="noDataText"></p>
        </div>

        <div id="charts">
          <div class="box section-box">
            <div class="chart-head">
              <h2 class="title is-4" id="amountTitle">Amount left</h2>
              <div class="chart-key" aria-hidden="true">
                <span><span class="key-line"></span><span id="amountKey">Amount left</span></span>
                <span><span class="key-dot"></span>Pour</span>
              </div>
              <div class="chart-toggles">
                <div class="buttons has-addons" id="measureChoice">
                  <button class="button is-small" type="button" data-value="amount">Amount</button>
                  <button class="button is-small" type="button" data-value="percent">%</button>
                </div>
                <div class="buttons has-addons" id="amountUnitChoice" hidden>
                  <button class="button is-small" type="button" data-value="gal">gal</button>
                  <button class="button is-small" type="button" data-value="oz">oz</button>
                </div>
                <div class="buttons has-addons" id="axisChoice"
                     title="Fit zooms the axis to this range so small pours show; Full starts it at zero.">
                  <button class="button is-small" type="button" data-value="fit">Fit</button>
                  <button class="button is-small" type="button" data-value="full">Full</button>
                </div>
              </div>
            </div>
            <div class="chart-wrap"><canvas id="amountChart"></canvas></div>
          </div>

          <div class="box section-box">
            <div class="chart-head">
              <h2 class="title is-4" id="tempTitle">Temperature</h2>
            </div>
            <div class="chart-wrap is-short"><canvas id="tempChart"></canvas></div>
          </div>
        </div>

        <div class="box section-box" id="poursBox" hidden>
          <div class="pours-head">
            <h2 class="title is-4">Pours</h2>
            <a class="button is-small" href="/pours.html">All pours &rarr;</a>
          </div>
          <div class="data-table-wrap">
            <table class="data-table">
              <thead>
                <tr><th>Time</th><th class="num">Amount</th><th class="num">Took</th><th>Beer</th><th class="actions"></th></tr>
              </thead>
              <tbody id="poursBody"></tbody>
            </table>
          </div>
          <div class="pager is-below" id="poursPager" hidden>
            <button class="button is-small" type="button" id="poursNewer">&larr; Newer</button>
            <span class="pager-label" id="poursPagerLabel"></span>
            <button class="button is-small" type="button" id="poursOlder">Older &rarr;</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div class="chart-tooltip" id="chartTooltip" hidden></div>
  <div id="toast" class="notification toast is-hidden"></div>

  <script>
    'use strict';

    const $ = id => document.getElementById(id);
    const RANGES = {
      '1h':  { ms: 3600e3,      label: 'Last hour' },
      '6h':  { ms: 6 * 3600e3,  label: 'Last 6 hours' },
      '24h': { ms: 24 * 3600e3, label: 'Last 24 hours' },
      '7d':  { ms: 7 * 86400e3, label: 'Last 7 days' },
      '30d': { ms: 30 * 86400e3, label: 'Last 30 days' },
      '90d': { ms: 90 * 86400e3, label: 'Last 3 months' },
      '180d': { ms: 180 * 86400e3, label: 'Last 6 months' },
      '1y':  { ms: 365 * 86400e3, label: 'Last year' },
    };
    const RANGE_ORDER = Object.keys(RANGES);
    // Readings are logged at most once a minute, so a longer silence is the
    // scale being offline; the line breaks there rather than bridging it.
    const GAP_MS = 10 * 60e3;
    // Windows past a day arrive averaged into steps, whose size the server
    // reports, and history older than the compaction cutoff is stored hourly.
    // Either way points sit further apart than a minute, so see gapsAfter.
    let stepMs = 0;
    // The times the loaded entries cover, which the charts span. Redrawing
    // after a toggle keeps this rather than sliding a preset on to now.
    let shownWindow = null;

    // gapsAfter returns the timestamps (ms) after which the line breaks. A
    // silence is a gap when it is longer than ten minutes, three steps, and
    // three times the median spacing of the points around it. The last keeps
    // hourly compacted history continuous in a short window while a scale
    // that went offline still shows as a break.
    function gapsAfter(times) {
      const diffs = times.slice(1).map((t, i) => t - times[i]);
      const gaps = new Set();
      diffs.forEach((d, i) => {
        const near = diffs.slice(Math.max(0, i - 5), i + 6).sort((a, b) => a - b);
        const median = near[Math.floor(near.length / 2)];
        if (d > Math.max(GAP_MS, 3 * stepMs, 3 * median)) gaps.add(times[i]);
      });
      return gaps;
    }

    let kegs = [];
    const tapsByKeg = {};
    let timeFormat = '12h';
    let measure = 'amount';
    // Fit zooms the amount axis to the range shown, so a pour from a nearly
    // full keg is a visible step; full starts it at zero.
    let axisScale = 'fit';
    // A keg shown in gallons can chart its amount in ounces instead, so a
    // single pour is a readable step. Only the chart and its readout change.
    let amountUnit = 'gal';
    let entries = [];
    // The scale's recorded pours for the range, newest first, and each one's
    // nearest logged reading, which places its marker on the line.
    let pours = [];
    let pourPoints = [];
    let minPour = null;
    let charts = [];
    let hoverTime = null;
    let loadSeq = 0;
    // The pours table shows a page at a time. Every pour in the range is
    // loaded anyway, for the chart's markers and the figures, so it pages in
    // the browser. A new scale or range starts again at the first page.
    const POURS_PAGE_SIZE = 25;
    let poursPage = 1;
    let poursView = '';

    const token = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

    // color resolves a colour token to rgba(), with an optional alpha. The
    // charts draw on a canvas through Chart.js, and neither can read the
    // var() and color-mix() that tokens.css derives its greys with. The
    // browser computes the colour, and a one-pixel canvas turns whatever form
    // it computes to into plain channels.
    const colorProbe = document.createElement('canvas').getContext('2d', { willReadFrequently: true });
    function color(name, alpha = 1) {
      const el = document.body.appendChild(document.createElement('span'));
      el.style.color = `var(${name})`;
      const computed = getComputedStyle(el).color;
      el.remove();
      colorProbe.clearRect(0, 0, 1, 1);
      colorProbe.fillStyle = computed;
      colorProbe.fillRect(0, 0, 1, 1);
      const [r, g, b] = colorProbe.getImageData(0, 0, 1, 1).data;
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function units(keg) {
      const raw = keg?.display?.amount_unit || keg?.beer_left_unit || '';
      return {
        amount: raw === 'litre' ? 'L' : raw,
        temp: keg?.display?.temperature_unit || keg?.temperature_unit || '',
      };
    }

    // The unit the amount chart is drawn in, and what turns a reading into it.
    const OZ_PER_GAL = 128;
    function chartAmount(keg) {
      const unit = units(keg).amount;
      return unit === 'gal' && amountUnit === 'oz'
        ? { mult: OZ_PER_GAL, unit: 'oz', digits: 1 }
        : { mult: 1, unit, digits: 2 };
    }

    // ── State in the URL ────────────────────────────
    // #keg=<id>&range=<range> records what is shown, so reload, Back and a
    // shared link all reopen the same view. A custom window is
    // range=custom&from=<unix>&to=<unix>; one that is malformed or ends before
    // it starts falls back to the last 24 hours.
    function readHash() {
      const p = new URLSearchParams(location.hash.slice(1));
      const id = p.get('keg');
      const keg = kegs.some(k => k.id === id) ? id : kegs[0]?.id ?? null;
      if (p.get('range') === 'custom') {
        const from = Number(p.get('from')), to = Number(p.get('to'));
        if (Number.isInteger(from) && Number.isInteger(to) && from < to) {
          return { keg, range: 'custom', from: from * 1000, to: to * 1000 };
        }
      }
      return { keg, range: RANGES[p.get('range')] ? p.get('range') : '24h' };
    }

    // setHash changes what is shown. Choosing a preset drops any custom times.
    function setHash(next) {
      const cur = readHash();
      const range = next.range ?? cur.range;
      const p = new URLSearchParams({ keg: next.keg ?? cur.keg, range });
      if (range === 'custom') {
        p.set('from', Math.floor((next.from ?? cur.from) / 1000));
        p.set('to', Math.floor((next.to ?? cur.to) / 1000));
      }
      location.hash = p.toString();
    }

    // The times a view covers, in ms. A preset ends now.
    function viewWindow(view) {
      if (view.range === 'custom') return { from: view.from, to: view.to };
      const to = Date.now();
      return { from: to - RANGES[view.range].ms, to };
    }

    // The query that asks the server for the same times.
    function windowQuery(view) {
      return view.range === 'custom'
        ? `from=${Math.floor(view.from / 1000)}&to=${Math.floor(view.to / 1000)}`
        : `range=${view.range}`;
    }

    const formatWhen = ms => {
      const d = new Date(ms);
      return d.toLocaleString([], { ...dateOpts(d), ...clockOpts() });
    };

    function viewLabel(view) {
      return view.range === 'custom'
        ? `${formatWhen(view.from)} – ${formatWhen(view.to)}`
        : RANGES[view.range].label;
    }

    function select(groupId, value) {
      $(groupId).querySelectorAll('.button').forEach(b =>
        b.classList.toggle('is-selected', b.dataset.value === value));
    }

    // ── Figures ─────────────────────────────────────
    // Pours are detected and stored by the server, so the page only counts
    // them. A pour's size arrives already in a pour-sized display unit.
    function pourTotal(list) {
      const unit = list[0]?.display?.unit ?? '';
      return { total: list.reduce((s, p) => s + (p.display?.amount ?? 0), 0), unit };
    }

    const pourSize = p => p.display ? `${Math.round(p.display.amount)} ${p.display.unit}` : '—';

    function fmt(v, digits) {
      return Number.isFinite(v) ? v.toFixed(digits) : '—';
    }

    // Whole degrees, as the tap list shows them; adding 0 turns -0 into 0.
    const deg = v => Number.isFinite(v) ? String(Math.round(v) + 0) : '—';

    function renderStats(keg) {
      const u = units(keg);
      const { total, unit: pourUnit } = pourTotal(pours);
      pourPoints = pours.map(p => ({ pour: p, entry: nearestEntry(p.ended_at * 1000) })).filter(pp => pp.entry);
      const temps = entries.map(e => e.keg_temperature).filter(Number.isFinite);
      // What is left now is the keg's current reading. The last entry of a
      // long range is an average over its step, so it is only the fallback.
      const leftNow = Number.isFinite(keg?.display?.amount_left) ? keg.display.amount_left
        : [...entries].reverse().find(e => Number.isFinite(e.amount_left))?.amount_left;
      const pctNow = Number.isFinite(keg?.percent_of_beer_left) ? keg.percent_of_beer_left
        : [...entries].reverse().find(e => Number.isFinite(e.percent_of_beer_left))?.percent_of_beer_left;
      const avg = temps.length ? temps.reduce((s, t) => s + t, 0) / temps.length : NaN;

      const stat = (value, unit, label) => `
        <div class="stat">
          <span class="stat-value">${value}${unit ? `<small>${esc(unit)}</small>` : ''}</span>
          <span class="stat-label">${esc(label)}</span>
        </div>`;
      $('stats').innerHTML = [
        stat(pours.length ? String(Math.round(total)) : '0', pourUnit, 'Poured'),
        stat(String(pours.length), '', pours.length === 1 ? 'Pour' : 'Pours'),
        stat(fmt(leftNow, 2), u.amount,
          Number.isFinite(pctNow) ? `Left now · ${Math.round(pctNow)}%` : 'Left now'),
        stat(deg(avg), u.temp, 'Average temp'),
        stat(temps.length ? `${deg(Math.min(...temps))}–${deg(Math.max(...temps))}` : '—', u.temp, 'Temp range'),
      ].join('');
      $('statsNote').textContent = minPour
        ? `A pour is one pouring window reported by the scale, ${minPour.value} ${minPour.unit} or more. Smaller ones are ignored.`
        : 'A pour is one pouring window reported by the scale.';
    }

    function renderPours() {
      $('poursBox').hidden = pours.length === 0;
      // A delete can leave the page past the end; show the last one instead.
      const pages = Math.max(1, Math.ceil(pours.length / POURS_PAGE_SIZE));
      poursPage = Math.min(poursPage, pages);
      const first = (poursPage - 1) * POURS_PAGE_SIZE;
      const page = pours.slice(first, first + POURS_PAGE_SIZE);
      $('poursPager').hidden = pages < 2;
      $('poursNewer').disabled = poursPage <= 1;
      $('poursOlder').disabled = poursPage >= pages;
      $('poursPagerLabel').textContent =
        `${first + 1}–${first + page.length} of ${pours.length.toLocaleString()}`;
      $('poursBody').innerHTML = page.map(p => {
        const ended = new Date(p.ended_at * 1000);
        const when = ended.toLocaleString([], { ...dateOpts(ended), ...clockOpts() });
        const took = Math.max(0, p.ended_at - p.started_at);
        const beer = p.beer_name?.trim();
        return `<tr>
          <td>${esc(when)}</td>
          <td class="num">${esc(pourSize(p))}</td>
          <td class="num">${took < 60 ? `${took}s` : `${Math.floor(took / 60)}m ${took % 60}s`}</td>
          <td class="${beer ? '' : 'is-faint'}">${esc(beer || 'No beer on tap')}</td>
          <td class="actions"><button class="button is-small is-danger" type="button" data-delete="${p.id}">Delete</button></td>
        </tr>`;
      }).join('');
    }

    // ── Charts ──────────────────────────────────────
    // Two charts on one time axis, rather than one chart with two y-axes:
    // amount and temperature have unrelated scales, and a second axis makes
    // their lines cross for no reason. Both span the whole range, keep their
    // y-axes the same width so their plots line up, and share one crosshair
    // and readout.
    const crosshair = {
      id: 'crosshair',
      afterDatasetsDraw(chart) {
        if (hoverTime == null) return;
        const x = chart.scales.x.getPixelForValue(hoverTime);
        const { top, bottom, left, right } = chart.chartArea;
        if (x < left || x > right) return;
        const ctx = chart.ctx;
        ctx.save();
        ctx.strokeStyle = color('--text', 0.35);
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(Math.round(x) + 0.5, top);
        ctx.lineTo(Math.round(x) + 0.5, bottom);
        ctx.stroke();
        ctx.restore();
      },
    };

    // ── Dates ───────────────────────────────────────
    // A date carries its year only when it is not this year's, so the short
    // ranges stay terse and a year-long one is never ambiguous.
    function dateOpts(d) {
      return { month: 'short', day: 'numeric',
        ...(d.getFullYear() !== new Date().getFullYear() && { year: 'numeric' }) };
    }

    const clockOpts = () => ({ hour: 'numeric', minute: '2-digit', hour12: timeFormat !== '24h' });

    // Where the x-axis ticks fall for a window of a given length, on clock or
    // calendar boundaries. Up to six months there are at most seven, so
    // Chart.js never has to thin them out and every label below is drawn; a
    // year has one per month, whose short labels still fit on a desktop. A
    // clock window ticks every so many minutes from midnight; the others tick
    // at midnight on the days the test picks. The presets fall in these bands
    // too, so a custom window of the same length looks the same.
    const DAY_MS = 86400e3;
    function tickSpec(span) {
      const date = d => d.getDate();
      if (span <= 1.5 * 3600e3) return { kind: 'clock', minutes: 10 };
      if (span <= 3 * 3600e3) return { kind: 'clock', minutes: 30 };
      if (span <= 7 * 3600e3) return { kind: 'clock', minutes: 60 };
      if (span <= 14 * 3600e3) return { kind: 'clock', minutes: 120 };
      if (span <= 1.5 * DAY_MS) return { kind: 'clock', minutes: 240 };
      if (span <= 3.5 * DAY_MS) return { kind: 'clock', minutes: 720 };
      if (span <= 8 * DAY_MS) return { kind: 'day', on: () => true };
      if (span <= 16 * DAY_MS) return { kind: 'day', on: d => date(d) % 2 === 1 && date(d) < 31 };
      if (span <= 45 * DAY_MS) return { kind: 'day', on: d => [1, 6, 11, 16, 21, 26].includes(date(d)) };
      if (span <= 100 * DAY_MS) return { kind: 'day', on: d => date(d) === 1 || date(d) === 15 };
      if (span <= 200 * DAY_MS) return { kind: 'day', on: d => date(d) === 1 };
      if (span <= 400 * DAY_MS) return { kind: 'month', on: d => date(d) === 1 };
      if (span <= 800 * DAY_MS) return { kind: 'month', on: d => date(d) === 1 && d.getMonth() % 2 === 0 };
      if (span <= 1500 * DAY_MS) return { kind: 'month', on: d => date(d) === 1 && d.getMonth() % 3 === 0 };
      return { kind: 'month', on: d => date(d) === 1 && d.getMonth() === 0 };
    }

    function axisTicks(min, max) {
      const spec = tickSpec(max - min);
      const d = new Date(min);
      d.setHours(0, 0, 0, 0);
      const out = [];
      // Stepping the Date, rather than adding milliseconds, keeps the ticks on
      // local midnights and hours across daylight-saving changes.
      while (d.getTime() <= max) {
        if (d.getTime() >= min && (spec.kind === 'clock' || spec.on(d))) out.push({ value: d.getTime() });
        if (spec.kind === 'clock') d.setMinutes(d.getMinutes() + spec.minutes);
        else d.setDate(d.getDate() + 1);
      }
      return out;
    }

    // A clock window labels its ticks with times, and puts the date beneath
    // the first one and wherever the day turns. Longer windows label them with
    // dates, or months beyond six months, and put the year beneath the first
    // one and wherever the year turns.
    function axisLabel(span) {
      const { kind } = tickSpec(span);
      const short = { month: 'short', day: 'numeric' };
      return (value, index, ticks) => {
        const d = new Date(value);
        const prev = index > 0 ? new Date(ticks[index - 1].value) : null;
        if (kind === 'clock') {
          const time = d.toLocaleTimeString([], clockOpts());
          return !prev || prev.toDateString() !== d.toDateString()
            ? [time, d.toLocaleDateString([], short)] : time;
        }
        const label = d.toLocaleDateString([], kind === 'day' ? short : { month: 'short' });
        return !prev || prev.getFullYear() !== d.getFullYear()
          ? [label, String(d.getFullYear())] : label;
      };
    }

    function chartOptions(win, yTitle, extraY = {}) {
      return {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        // Hover is handled below, so both charts answer to the same time.
        events: [],
        plugins: { legend: { display: false }, tooltip: { enabled: false } },
        layout: { padding: { right: 8 } },
        scales: {
          x: {
            type: 'time',
            min: win.from,
            max: win.to,
            afterBuildTicks: scale => { scale.ticks = axisTicks(scale.min, scale.max); },
            ticks: { maxRotation: 0, callback: axisLabel(win.to - win.from) },
            grid: { display: false },
          },
          y: {
            title: { display: true, text: yTitle },
            ticks: { maxTicksLimit: 6 },
            afterFit: scale => { scale.width = 64; },
            ...extraY,
          },
        },
      };
    }

    // fitAxis pads the lowest and highest value shown by 15% (with a floor, so
    // a flat line still has room) and hands them to Chart.js as suggestions,
    // which it rounds out to tidy ticks.
    function fitAxis(values, pct) {
      const v = values.filter(Number.isFinite);
      if (!v.length) return pct ? { min: 0, max: 100 } : { beginAtZero: true };
      const lo = Math.min(...v), hi = Math.max(...v);
      const pad = Math.max((hi - lo) * 0.15, pct ? 1 : Math.max(hi * 0.01, 0.05));
      return {
        suggestedMin: Math.max(0, lo - pad),
        suggestedMax: pct ? Math.min(100, hi + pad) : hi + pad,
        ...(pct && { max: 100 }),
      };
    }

    function destroyCharts() {
      charts.forEach(c => c.destroy());
      charts = [];
    }

    function renderCharts(keg, win) {
      destroyCharts();
      Chart.defaults.color = color('--muted');
      Chart.defaults.borderColor = color('--text', 0.06);
      Chart.defaults.font.family = token('--sans');

      const u = units(keg);
      const action = color('--action');
      const pour = color('--pour');
      const surface = color('--tile');
      const pct = measure === 'percent';
      const amt = chartAmount(keg);
      $('amountUnitChoice').hidden = pct || u.amount !== 'gal';
      const amountLabel = pct ? 'Left (%)' : amt.unit ? `Left (${amt.unit})` : 'Left';
      $('amountKey').textContent = pct ? 'Percent left' : 'Amount left';
      $('tempTitle').textContent = 'Temperature';

      const value = e => pct ? e.percent_of_beer_left
        : Number.isFinite(e.amount_left) ? e.amount_left * amt.mult : e.amount_left;
      const line = list => list.map(e => ({ x: e.timestamp * 1000, y: value(e) ?? null }));
      // A segment across a gap is drawn invisibly, line and fill alike. A
      // reading that was not reported is skipped rather than breaking the
      // line, so each line's gaps come from the points it actually draws.
      const segmentFor = points => {
        const gaps = gapsAfter(points.filter(p => p.y != null).map(p => p.x));
        const hide = c => gaps.has(c.p0.parsed.x) ? 'transparent' : undefined;
        return { borderColor: hide, backgroundColor: hide };
      };
      const amountPoints = line(entries);
      const tempPoints = entries.map(e => ({ x: e.timestamp * 1000, y: e.keg_temperature ?? null }));
      const fit = axisScale === 'fit';
      const fullY = pct ? { min: 0, max: 100 } : { beginAtZero: true };

      charts.push(new Chart($('amountChart'), {
        type: 'line',
        data: {
          datasets: [
            {
              data: amountPoints,
              borderColor: action,
              backgroundColor: color('--action', 0.1),
              borderWidth: 2,
              borderJoinStyle: 'round',
              borderCapStyle: 'round',
              // Shaded down to the bottom of the axis, which is zero on Full.
              fill: 'start',
              pointRadius: 0,
              tension: 0.15,
              spanGaps: true,
              segment: segmentFor(amountPoints),
            },
            {
              // Pours, ringed in the tile colour so they stay clear of the line.
              type: 'scatter',
              data: pourPoints.map(({ pour: p, entry }) => ({ x: p.ended_at * 1000, y: value(entry) ?? null })),
              backgroundColor: pour,
              borderColor: surface,
              borderWidth: 2,
              pointRadius: 5,
            },
          ],
        },
        options: chartOptions(win, amountLabel, fit ? fitAxis(entries.map(value), pct) : fullY),
        plugins: [crosshair],
      }));

      charts.push(new Chart($('tempChart'), {
        type: 'line',
        data: {
          datasets: [{
            data: tempPoints,
            borderColor: '#8fb3ff',
            borderWidth: 2,
            borderJoinStyle: 'round',
            borderCapStyle: 'round',
            pointRadius: 0,
            tension: 0.15,
            spanGaps: true,
            segment: segmentFor(tempPoints),
          }],
        },
        options: chartOptions(win, u.temp ? `Temp (${u.temp})` : 'Temp'),
        plugins: [crosshair],
      }));
    }

    // ── Hover readout ───────────────────────────────
    function nearestEntry(time) {
      let best = null, bestGap = Infinity;
      for (const e of entries) {
        const gap = Math.abs(e.timestamp * 1000 - time);
        if (gap < bestGap) { best = e; bestGap = gap; }
      }
      return best;
    }

    function showReadout(event, chart) {
      const area = chart.chartArea;
      const rect = chart.canvas.getBoundingClientRect();
      const x = event.clientX - rect.left;
      if (x < area.left || x > area.right) return hideReadout();

      const e = nearestEntry(chart.scales.x.getValueForPixel(x));
      if (!e) return hideReadout();
      hoverTime = e.timestamp * 1000;
      charts.forEach(c => c.draw());

      const keg = kegs.find(k => k.id === readHash().keg);
      const u = units(keg);
      const amt = chartAmount(keg);
      const tip = $('chartTooltip');
      tip.replaceChildren();
      const time = document.createElement('div');
      time.className = 'chart-tooltip-time';
      const hovered = new Date(hoverTime);
      time.textContent = hovered.toLocaleString([], { ...dateOpts(hovered), ...clockOpts() });
      tip.append(time);

      const row = (color, isDot, value, label) => {
        const r = document.createElement('div');
        r.className = 'chart-tooltip-row';
        const key = document.createElement('span');
        key.className = 'key' + (isDot ? ' is-dot' : '');
        key.style.background = color;
        const strong = document.createElement('strong');
        strong.textContent = value;
        r.append(key, strong, document.createTextNode(label));
        tip.append(r);
      };
      row(token('--action'), false,
        `${fmt(e.amount_left * amt.mult, amt.digits)} ${amt.unit}`.trim() +
          (Number.isFinite(e.percent_of_beer_left) ? ` · ${Math.round(e.percent_of_beer_left)}%` : ''),
        'Left');
      row('#8fb3ff', false, `${deg(e.keg_temperature)}${u.temp}`, 'Temperature');
      for (const { pour: p, entry } of pourPoints) {
        if (entry === e) row(token('--pour'), true, pourSize(p), 'Pour');
      }

      tip.hidden = false;
      const w = tip.offsetWidth, h = tip.offsetHeight;
      let left = event.clientX + 14;
      if (left + w > innerWidth - 8) left = event.clientX - w - 14;
      tip.style.left = left + 'px';
      tip.style.top = Math.min(event.clientY + 14, innerHeight - h - 8) + 'px';
    }

    function hideReadout() {
      $('chartTooltip').hidden = true;
      if (hoverTime != null) {
        hoverTime = null;
        charts.forEach(c => c.draw());
      }
    }

    for (const id of ['amountChart', 'tempChart']) {
      const canvas = $(id);
      canvas.addEventListener('pointermove', ev => {
        const chart = charts.find(c => c.canvas === canvas);
        if (chart && entries.length) showReadout(ev, chart);
      });
      canvas.addEventListener('pointerleave', hideReadout);
    }

    // ── Loading ─────────────────────────────────────
    async function show() {
      const view = readHash();
      const { keg: id, range } = view;
      if (!id) return;
      select('scaleChoice', id);
      select('rangeChoice', range);
      showCustom(view);
      const win = viewWindow(view);
      const query = windowQuery(view);
      $('downloadBtn').href = `/api/kegs/${encodeURIComponent(id)}/log/csv?${query}`;
      // The editor pages through a fixed window, so a preset goes as the
      // times it covers now.
      $('editBtn').href = '/history-edit.html#' + new URLSearchParams({
        keg: id, from: Math.floor(win.from / 1000), to: Math.ceil(win.to / 1000),
      });
      $('statsTitle').textContent = viewLabel(view);

      const seq = ++loadSeq;
      $('page').classList.add('is-loading');
      try {
        const [res, pourList, fresh] = await Promise.all([
          // fetch rather than api, for the X-Log-Step-Seconds header.
          fetch(`/api/kegs/${encodeURIComponent(id)}/log?${query}`),
          api('GET', `/api/kegs/${encodeURIComponent(id)}/pours?${query}`),
          // The keg's current readings, for "Left now"; the list loaded with
          // the page may be stale by now.
          api('GET', `/api/kegs/${encodeURIComponent(id)}`).catch(() => null),
        ]);
        if (!res.ok) throw new Error(res.status);
        const list = await res.json();
        if (seq !== loadSeq) return; // a newer choice has already been made
        entries = list;
        pours = pourList;
        shownWindow = win;
        stepMs = (Number(res.headers.get('X-Log-Step-Seconds')) || 0) * 1000;
        if (fresh) {
          const i = kegs.findIndex(k => k.id === id);
          if (i >= 0) kegs[i] = fresh;
        }
      } catch (_) {
        if (seq !== loadSeq) return;
        $('page').classList.remove('is-loading');
        $('pageStatus').textContent = 'Could not load the history. Is the server running?';
        $('results').hidden = true;
        return;
      }
      $('page').classList.remove('is-loading');
      hideReadout();

      const keg = kegs.find(k => k.id === id);
      $('pageStatus').textContent = '';
      $('results').hidden = false;
      renderStats(keg);
      const viewKey = `${id}|${query}`;
      if (viewKey !== poursView) { poursView = viewKey; poursPage = 1; }
      renderPours();

      const empty = entries.length === 0;
      // With no readings, zeroes would read as a measured nothing.
      $('noData').hidden = !empty;
      $('statsBox').hidden = empty;
      $('charts').hidden = empty;
      if (empty) {
        destroyCharts();
        const longer = range === 'custom' ? null : RANGE_ORDER[RANGE_ORDER.indexOf(range) + 1];
        const text = $('noDataText');
        text.textContent = range === 'custom'
          ? `No readings from ${displayName(keg)} between ${viewLabel(view).replace(' – ', ' and ')}.`
          : `No readings from ${displayName(keg)} in the ${RANGES[range].label.toLowerCase()}.`;
        if (longer) {
          text.append(document.createElement('br'));
          const more = document.createElement('a');
          more.className = 'button';
          more.href = '#' + new URLSearchParams({ keg: id, range: longer });
          more.textContent = `Show ${RANGES[longer].label.toLowerCase()}`;
          text.append(more);
        }
        return;
      }
      renderCharts(keg, win);
    }

    // ── Custom window ───────────────────────────────
    // datetime-local inputs speak local time as "YYYY-MM-DDTHH:MM".
    function toLocalInput(ms) {
      const d = new Date(ms);
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function fillCustom(win) {
      $('customFrom').value = toLocalInput(win.from);
      $('customTo').value = toLocalInput(win.to);
    }

    // The custom inputs show while a custom window is shown, filled with it.
    // Choosing a preset hides them again.
    function showCustom(view) {
      const custom = view.range === 'custom';
      if (custom) fillCustom(view);
      $('customRange').hidden = !custom;
      $('customError').hidden = true;
    }

    // Choosing Custom opens the inputs on the window already shown, so it can
    // be adjusted, and changes nothing until Apply.
    function openCustom() {
      select('rangeChoice', 'custom');
      if ($('customRange').hidden) fillCustom(shownWindow ?? viewWindow(readHash()));
      $('customRange').hidden = false;
      $('customError').hidden = true;
      $('customFrom').focus();
    }

    $('customForm').addEventListener('submit', e => {
      e.preventDefault();
      // An unparseable value gives NaN, which fails both checks below.
      const from = new Date($('customFrom').value).getTime();
      const to = new Date($('customTo').value).getTime();
      const error = !Number.isFinite(from) || !Number.isFinite(to)
        ? 'Choose a start and an end.'
        : to <= from ? 'The end must be after the start.' : '';
      $('customError').textContent = error;
      $('customError').hidden = !error;
      if (!error) setHash({ range: 'custom', from, to });
    });

    $('scaleChoice').addEventListener('click', e => {
      const b = e.target.closest('.button');
      if (b) setHash({ keg: b.dataset.value });
    });
    $('rangeChoice').addEventListener('click', e => {
      const b = e.target.closest('.button');
      if (!b) return;
      if (b.dataset.value === 'custom') openCustom();
      else setHash({ range: b.dataset.value });
    });
    $('axisChoice').addEventListener('click', e => {
      const b = e.target.closest('.button');
      if (!b || b.dataset.value === axisScale) return;
      axisScale = b.dataset.value;
      select('axisChoice', axisScale);
      if (entries.length) renderCharts(kegs.find(k => k.id === readHash().keg), shownWindow);
    });
    $('measureChoice').addEventListener('click', e => {
      const b = e.target.closest('.button');
      if (!b || b.dataset.value === measure) return;
      measure = b.dataset.value;
      select('measureChoice', measure);
      if (entries.length) renderCharts(kegs.find(k => k.id === readHash().keg), shownWindow);
    });
    $('amountUnitChoice').addEventListener('click', e => {
      const b = e.target.closest('.button');
      if (!b || b.dataset.value === amountUnit) return;
      amountUnit = b.dataset.value;
      select('amountUnitChoice', amountUnit);
      if (entries.length) renderCharts(kegs.find(k => k.id === readHash().keg), shownWindow);
    });
    // ── Clearing ────────────────────────────────────
    // The scale as the selector names it: its beer, if a tap draws from it.
    const displayName = keg => kegNameWithBeer(keg, kegs.indexOf(keg), tapsByKeg[keg.id]);

    $('clearBtn').addEventListener('click', async () => {
      const keg = kegs.find(k => k.id === readHash().keg);
      if (!keg) return;
      // History belongs to the scale, so this clears every range, not only
      // the one on screen.
      if (!confirm(`Clear all history for ${displayName(keg)}?\n\n` +
          'This deletes every reading recorded for this scale, in every range, ' +
          'not just the one shown, and removes its pours from this page. ' +
          'The pours stay on All Pours. It cannot be undone.')) return;
      try {
        await api('DELETE', `/api/kegs/${encodeURIComponent(keg.id)}/log`);
        showToast('History cleared', 'success');
      } catch (e) {
        showToast('Could not clear the history: ' + e.message, 'danger');
      }
      show();
    });

    $('poursBody').addEventListener('click', async e => {
      const b = e.target.closest('[data-delete]');
      if (!b) return;
      const p = pours.find(x => String(x.id) === b.dataset.delete);
      if (!p || !confirm(`Delete this ${pourSize(p)} pour? It is removed everywhere, including All Pours.`)) return;
      try {
        await api('DELETE', `/api/pours/${encodeURIComponent(p.id)}`);
        showToast('Pour deleted', 'success');
      } catch (err) {
        showToast('Could not delete the pour: ' + err.message, 'danger');
      }
      show();
    });

    $('poursNewer').addEventListener('click', () => { poursPage--; renderPours(); });
    $('poursOlder').addEventListener('click', () => { poursPage++; renderPours(); });

    window.addEventListener('hashchange', show);

    async function init() {
      select('measureChoice', measure);
      select('axisChoice', axisScale);
      select('amountUnitChoice', amountUnit);
      try {
        const [kegList, cfg, tapList] = await Promise.all([
          api('GET', '/api/kegs'),
          // The minimum pour is only for the note under the figures.
          api('GET', '/api/config').catch(() => ({})),
          // Only for labelling the scales, so a failure just leaves them
          // named by scale.
          api('GET', '/api/taps').catch(() => []),
        ]);
        minPour = cfg.min_pour ?? null;
        kegs = kegList;
        timeFormat = cfg.time_format || '12h';
        // The first tap, by tap number, that draws from each scale.
        for (const tap of tapList) {
          if (tap.keg_id && !(tap.keg_id in tapsByKeg)) tapsByKeg[tap.keg_id] = tap;
        }
      } catch (_) {
        $('pageStatus').textContent = 'Could not load the keg scales. Is the server running?';
        return;
      }
      if (!kegs.length) {
        $('pageStatus').textContent = 'No keg scales yet. Once a Plaato Keg connects, its history appears here.';
        $('downloadBtn').hidden = true;
        $('clearBtn').hidden = true;
        $('editBtn').hidden = true;
        return;
      }
      // A scale that feeds a tap is labelled by its beer, which is what the
      // reader is looking for, with the scale's own name beneath it.
      $('scaleChoice').innerHTML = kegs.map((k, i) => {
        const beer = tapsByKeg[k.id]?.name?.trim();
        const label = beer
          ? `<span class="scale-beer">${esc(beer)}</span><span class="scale-name">${esc(kegName(k, i))}</span>`
          : `<span class="scale-beer">${esc(kegName(k, i))}</span>`;
        return `<button class="button scale-option" type="button" data-value="${esc(k.id)}">${label}</button>`;
      }).join('');
      show();
    }

    init();
  </script>
</body>
</html>
