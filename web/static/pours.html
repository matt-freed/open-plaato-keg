<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Pours</title>
    <link rel="stylesheet" href="/tokens.css">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/site-header.css">
    <script src="/site-header.js"></script>
    <script src="/common.js"></script>
    <style>
      /* Scale follows the right-aligned ABV, so it needs its own space. */
      .data-table .scale-col { padding-left: 1.25rem; }
      .controls {
        display: flex; flex-wrap: wrap; align-items: flex-end; gap: 1rem 1.5rem;
        margin-bottom: 1.25rem;
      }
      .controls .field { margin: 0; }
      .controls .buttons.has-addons { flex-wrap: wrap; }
      .page-top { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap; }
      .page-top .back-link { margin-bottom: 0.75rem; }
      .page-top .buttons { display: flex; gap: 0.5rem; flex-wrap: wrap; margin: 0; }

      .stats {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 1.25rem 1.5rem;
      }
      .stat { display: flex; flex-direction: column; gap: 0.2rem; min-width: 0; }
      .stat-value { font-size: 1.6rem; font-weight: 650; line-height: 1.1; letter-spacing: -0.01em; white-space: nowrap; }
      .stat-value small { margin-left: 0.2rem; font-size: 0.9rem; font-weight: 500; color: var(--muted); letter-spacing: 0; }
      .stat-label { font-size: 0.68rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; }
      .by-beer { margin-top: 1.25rem; }
      .is-loading .section-box { opacity: 0.45; transition: opacity 0.15s; }
      .hidden-tag { margin-left: 0.4rem; font-size: 0.7rem; color: var(--faint); }

      /* Edit mode: its toolbar sits above the table it acts on. */
      .edit-bar { display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 0.75rem; }
      .edit-bar .buttons { display: flex; gap: 0.5rem; flex-wrap: wrap; margin: 0; }
      .edit-table .input.is-text { width: 9rem; }
      .edit-table .input.is-short { width: 4.5rem; }
      .amount-cell { display: inline-flex; align-items: center; gap: 0.35rem; }
      .amount-cell .unit { font-size: 0.8rem; color: var(--muted); }
    </style>
</head>
<body>
  <site-header heading="All Pours"></site-header>

  <section class="section">
    <div class="container is-centered is-wide" id="page">
      <div class="page-top">
        <a class="back-link" href="/history.html">&larr; History</a>
        <div class="buttons">
          <button class="button is-small" type="button" id="editBtn">Edit</button>
          <a class="button is-small" id="downloadBtn" href="/api/pours/csv?range=30d" download>&#8595; Download CSV</a>
        </div>
      </div>

      <div class="controls">
        <div class="field">
          <span class="label">Range</span>
          <div class="buttons has-addons" id="rangeChoice">
            <button class="button" type="button" data-value="24h">24 hours</button>
            <button class="button" type="button" data-value="7d">7 days</button>
            <button class="button" type="button" data-value="30d">30 days</button>
            <button class="button" type="button" data-value="90d">90 days</button>
            <button class="button" type="button" data-value="1y">1 year</button>
            <button class="button" type="button" data-value="all">All</button>
          </div>
        </div>
        <div class="field">
          <label class="label" for="beerFilter">Beer</label>
          <div class="select"><select id="beerFilter"></select></div>
        </div>
        <div class="field">
          <label class="label" for="scaleFilter">Scale</label>
          <div class="select"><select id="scaleFilter"></select></div>
        </div>
      </div>

      <p class="empty-state" id="pageStatus">Loading…</p>

      <div id="results" hidden>
        <div class="box section-box">
          <h2 class="title is-4" id="statsTitle">Last 30 days</h2>
          <div class="stats" id="stats"></div>
          <div class="data-table-wrap by-beer" id="byBeerWrap">
            <table class="data-table">
              <thead><tr><th>Beer</th><th class="num">Pours</th><th class="num">Poured</th></tr></thead>
              <tbody id="byBeer"></tbody>
            </table>
          </div>
        </div>

        <div class="box section-box">
          <div class="edit-bar" id="editBar" hidden>
            <div class="buttons">
              <button class="button is-small is-danger" type="button" id="deleteBtn" disabled>Delete selected</button>
              <button class="button is-small is-primary" type="button" id="saveBtn" disabled>Save changes</button>
              <button class="button is-small" type="button" id="discardBtn" disabled>Discard</button>
            </div>
            <button class="button is-small" type="button" id="doneBtn">Done</button>
          </div>
          <div class="data-table-wrap" id="tableWrap">
            <table class="data-table" id="poursTable">
              <thead id="poursHead"></thead>
              <tbody id="poursBody"></tbody>
            </table>
          </div>
          <p class="empty-state" id="noPours" hidden></p>
          <div class="pager is-below" id="pager" hidden>
            <button class="button is-small" type="button" id="newerBtn">&larr; Newer</button>
            <span class="pager-label" id="pagerLabel"></span>
            <button class="button is-small" type="button" id="olderBtn">Older &rarr;</button>
          </div>
          <p class="help" id="editNote" hidden>
            Amounts are in the display units and stored in each scale's own. Edits are corrections:
            they are not checked against the minimum pour.
          </p>
        </div>
      </div>
    </div>
  </section>

  <div id="toast" class="notification toast is-hidden"></div>

  <script>
    'use strict';

    const $ = id => document.getElementById(id);
    const RANGES = {
      '24h': 'Last 24 hours',
      '7d':  'Last 7 days',
      '30d': 'Last 30 days',
      '90d': 'Last 90 days',
      '1y':  'Last year',
      'all': 'All time',
    };
    const NO_BEER = 'No beer on tap';
    const PAGE_SIZE = 100;
    // The beer filter's option for pours with no beer; named beers are
    // prefixed so no name can collide with it or with "all".
    const NONE_OPTION = 'none';
    const beerOption = name => 'b:' + name;

    // The filtered pours' figures and the filters' choices, from the server,
    // and the page of pours shown.
    let summary = null;
    let pours = [];
    let total = 0;
    let timeFormat = '12h';
    let loadSeq = 0;
    let editing = false;
    // Values as loaded, by pour id, so only what changed is saved.
    let original = new Map();
    const selected = new Set();

    const beerOf = p => p.beer_name?.trim() || NO_BEER;
    const scaleName = (label, kegId) => label?.trim() || `Scale …${kegId.slice(-4)}`;
    const scaleOf = p => scaleName(p.scale_label, p.keg_id);
    const size = p => p.display ? `${Math.round(p.display.amount)} ${p.display.unit}` : '—';
    const totalsText = list => list?.map(t => `${Math.round(t.amount)} ${t.unit}`).join(' + ') || '—';

    // ── State in the URL ────────────────────────────
    // #range=<range>&beer=<name>&keg=<id>&page=<n>, so reload, Back and a
    // shared link reopen the same view. A present but empty beer is the pours
    // with no beer on tap.
    function readHash() {
      const p = new URLSearchParams(location.hash.slice(1));
      const page = Number(p.get('page'));
      return {
        range: RANGES[p.get('range')] ? p.get('range') : '30d',
        beer: p.has('beer') ? p.get('beer') : null,
        keg: p.get('keg') ?? '',
        page: Number.isInteger(page) && page > 1 ? page : 1,
      };
    }

    // setHash changes what is shown. Anything but a page change starts again
    // at the first page.
    function setHash(next) {
      const cur = { ...readHash(), page: 1, ...next };
      const p = new URLSearchParams({ range: cur.range });
      if (cur.beer !== null) p.set('beer', cur.beer);
      if (cur.keg) p.set('keg', cur.keg);
      if (cur.page > 1) p.set('page', cur.page);
      location.hash = p.toString();
    }

    // The query for the filters, shared by the page, summary and CSV.
    function filterQuery(view) {
      const p = new URLSearchParams({ range: view.range });
      if (view.beer !== null) p.set('beer', view.beer);
      if (view.keg) p.set('keg', view.keg);
      return p;
    }

    function select(groupId, value) {
      $(groupId).querySelectorAll('.button').forEach(b =>
        b.classList.toggle('is-selected', b.dataset.value === value));
    }

    // ── Figures and filters ─────────────────────────
    // The filters offer whatever beers and scales the range holds, which the
    // server lists whatever is chosen, plus the chosen one even if the range
    // no longer has it, so a choice never vanishes.
    function renderFilters(view) {
      const beers = [...summary.beers];
      if (view.beer !== null && !beers.includes(view.beer)) beers.unshift(view.beer);
      $('beerFilter').innerHTML = '<option value="">All beers</option>' + beers.map(name => name
        ? `<option value="${esc(beerOption(name))}">${esc(name)}</option>`
        : `<option value="${NONE_OPTION}">${NO_BEER}</option>`).join('');
      $('beerFilter').value = view.beer === null ? '' : view.beer ? beerOption(view.beer) : NONE_OPTION;

      const scales = [...summary.scales];
      if (view.keg && !scales.some(s => s.keg_id === view.keg)) scales.unshift({ keg_id: view.keg, label: '' });
      $('scaleFilter').innerHTML = '<option value="">All scales</option>' + scales.map(s =>
        `<option value="${esc(s.keg_id)}">${esc(scaleName(s.label, s.keg_id))}</option>`).join('');
      $('scaleFilter').value = view.keg;
    }

    function renderSummary(view) {
      $('statsTitle').textContent = RANGES[view.range];
      const stat = (value, label) => `
        <div class="stat">
          <span class="stat-value">${esc(value)}</span>
          <span class="stat-label">${esc(label)}</span>
        </div>`;
      const beers = summary.by_beer.length;
      $('stats').innerHTML = [
        stat(String(summary.count), summary.count === 1 ? 'Pour' : 'Pours'),
        stat(totalsText(summary.totals), 'Poured'),
        stat(String(beers), beers === 1 ? 'Beer' : 'Beers'),
      ].join('');
      $('byBeerWrap').hidden = beers < 2;
      $('byBeer').innerHTML = summary.by_beer.map(b => `
        <tr>
          <td class="${b.name ? '' : 'is-faint'}">${esc(b.name || NO_BEER)}</td>
          <td class="num">${b.count}</td>
          <td class="num">${esc(totalsText(b.totals))}</td>
        </tr>`).join('');
    }

    // ── The table ───────────────────────────────────
    // How long the pour ran, as the History page shows it.
    const took = p => {
      const s = Math.max(0, p.ended_at - p.started_at);
      return s < 60 ? `${s}s` : `${Math.floor(s / 60)}m ${s % 60}s`;
    };

    function when(p, range) {
      return new Date(p.ended_at * 1000).toLocaleString([], {
        year: range === '1y' || range === 'all' ? 'numeric' : undefined,
        month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit',
        hour12: timeFormat !== '24h',
      });
    }

    function renderView(range) {
      $('poursHead').innerHTML = `<tr>
        <th>When</th><th>Beer</th><th>Style</th><th class="num">ABV</th>
        <th class="scale-col">Scale</th><th class="num">Took</th><th class="num">Amount</th>
      </tr>`;
      $('poursBody').innerHTML = pours.map(p => `
        <tr>
          <td>${esc(when(p, range))}</td>
          <td class="${beerOf(p) === NO_BEER ? 'is-faint' : ''}">${esc(beerOf(p))}</td>
          <td>${esc(p.beer_style)}</td>
          <td class="num">${Number.isFinite(p.abv) ? `${p.abv.toFixed(1)}%` : ''}</td>
          <td class="scale-col">${esc(scaleOf(p))}${p.hidden_from_keg
            ? '<span class="hidden-tag" title="This scale’s history was cleared, so the pour only shows here.">history cleared</span>' : ''}</td>
          <td class="num">${esc(took(p))}</td>
          <td class="num">${esc(size(p))}</td>
        </tr>`).join('');
    }

    // Edit mode turns the page's rows into inputs. Numbers are shown to a
    // precision they can be edited at, and a cell left alone is compared with
    // that shown value, never sent.
    const shown = (v, digits) => Number.isFinite(v) ? Number(v.toFixed(digits)) : null;

    function renderEdit(range) {
      original = new Map();
      selected.clear();
      $('poursHead').innerHTML = `<tr>
        <th class="check"><input type="checkbox" id="selectAll" aria-label="Select every pour on this page"></th>
        <th>When</th><th>Beer</th><th>Style</th><th class="num">ABV</th><th class="num">Tap</th>
        <th>Scale</th><th class="num">Took</th><th class="num">Amount</th>
      </tr>`;
      $('poursBody').innerHTML = pours.map(p => {
        const was = {
          beer_name: p.beer_name?.trim() ?? '',
          beer_style: p.beer_style?.trim() ?? '',
          abv: shown(p.abv, 2),
          tap_number: Number.isInteger(p.tap_number) ? p.tap_number : null,
          scale_label: p.scale_label?.trim() ?? '',
          amount: shown(p.display?.amount, 1),
        };
        original.set(p.id, was);
        const text = (field, label, cls = 'is-text') => `<input class="input ${cls}" type="text"
          data-field="${field}" aria-label="${label}" value="${esc(was[field])}" maxlength="200">`;
        const num = (field, label, cls = 'is-short') => `<input class="input is-number ${cls}" type="text"
          inputmode="decimal" data-field="${field}" aria-label="${label}" value="${was[field] ?? ''}">`;
        return `
          <tr data-id="${p.id}">
            <td class="check"><input type="checkbox" aria-label="Select this pour"></td>
            <td>${esc(when(p, range))}</td>
            <td>${text('beer_name', 'Beer')}</td>
            <td>${text('beer_style', 'Style')}</td>
            <td class="num">${num('abv', 'ABV')}</td>
            <td class="num">${num('tap_number', 'Tap number')}</td>
            <td>${text('scale_label', 'Scale label')}</td>
            <td class="num">${esc(took(p))}</td>
            <td class="num"><span class="amount-cell">${num('amount', 'Amount', '')}<span class="unit">${esc(p.display?.unit ?? '')}</span></span></td>
          </tr>`;
      }).join('');
      $('selectAll').addEventListener('change', e => {
        for (const box of $('poursBody').querySelectorAll('input[type="checkbox"]')) {
          box.checked = e.target.checked;
          toggleSelected(box);
        }
        updateEditBar();
      });
      updateEditBar();
    }

    // A cell's value as the API takes it, or undefined when it is invalid.
    function cellValue(el) {
      const text = el.value.trim();
      switch (el.dataset.field) {
        case 'beer_name': case 'beer_style': case 'scale_label':
          return text;
        case 'amount': {
          const n = Number(text);
          return text !== '' && Number.isFinite(n) && n > 0 ? n : undefined;
        }
        case 'abv': {
          if (text === '') return null;
          const n = Number(text);
          return Number.isFinite(n) && n >= 0 && n <= 100 ? n : undefined;
        }
        case 'tap_number': {
          if (text === '') return null;
          const n = Number(text);
          return Number.isInteger(n) && n >= 0 ? n : undefined;
        }
      }
    }

    // The edits on the page: per pour, only the fields that differ from what
    // was loaded. Also reports whether any cell is invalid.
    function collectEdits() {
      const edits = [];
      let invalid = false;
      for (const tr of $('poursBody').querySelectorAll('tr[data-id]')) {
        const id = Number(tr.dataset.id);
        const was = original.get(id);
        const edit = { id };
        let changed = false;
        for (const el of tr.querySelectorAll('[data-field]')) {
          const v = cellValue(el);
          const field = el.dataset.field;
          const differs = v !== was[field];
          el.classList.toggle('is-invalid', v === undefined);
          el.classList.toggle('is-changed', v !== undefined && differs);
          if (v === undefined) invalid = true;
          else if (differs) { edit[field] = v; changed = true; }
        }
        if (changed) edits.push(edit);
      }
      return { edits, invalid };
    }

    function updateEditBar() {
      if (!editing) return;
      const { edits, invalid } = collectEdits();
      $('saveBtn').disabled = !edits.length || invalid;
      $('saveBtn').textContent = edits.length ? `Save changes (${edits.length})` : 'Save changes';
      $('discardBtn').disabled = !edits.length && !invalid;
      $('deleteBtn').disabled = !selected.size;
      $('deleteBtn').textContent = selected.size ? `Delete selected (${selected.size})` : 'Delete selected';
      const boxes = $('poursBody').querySelectorAll('input[type="checkbox"]').length;
      $('selectAll').checked = boxes > 0 && selected.size === boxes;
      $('selectAll').indeterminate = selected.size > 0 && selected.size < boxes;
    }

    function toggleSelected(box) {
      const tr = box.closest('tr');
      const id = Number(tr.dataset.id);
      if (box.checked) selected.add(id); else selected.delete(id);
      tr.classList.toggle('is-selected', box.checked);
    }

    const hasUnsaved = () => editing && !$('discardBtn').disabled;
    // Anything that reloads the table drops unsaved edits, so it asks first.
    const leaveOk = () => !hasUnsaved() || confirm('Discard your unsaved changes?');

    function renderTable() {
      const { range, page } = readHash();
      $('editBtn').hidden = editing;
      $('editBar').hidden = !editing;
      $('editNote').hidden = !editing;
      $('poursTable').classList.toggle('edit-table', editing);
      if (editing) renderEdit(range); else renderView(range);

      const empty = pours.length === 0;
      $('tableWrap').hidden = empty;
      $('noPours').hidden = !empty;
      $('noPours').textContent = summary.beers.length
        ? 'No pours match these filters.'
        : `No pours in the ${RANGES[range].toLowerCase()}.`;

      const first = (page - 1) * PAGE_SIZE;
      $('pager').hidden = total <= PAGE_SIZE;
      $('newerBtn').disabled = page <= 1;
      $('olderBtn').disabled = first + pours.length >= total;
      $('pagerLabel').textContent = empty ? '' :
        `${(first + 1).toLocaleString()}–${(first + pours.length).toLocaleString()} of ${total.toLocaleString()}`;
    }

    // ── Loading ─────────────────────────────────────
    async function show() {
      const view = readHash();
      select('rangeChoice', view.range);
      const query = filterQuery(view);
      $('downloadBtn').href = `/api/pours/csv?${query}`;
      const pageQuery = new URLSearchParams(query);
      pageQuery.set('limit', PAGE_SIZE);
      pageQuery.set('offset', (view.page - 1) * PAGE_SIZE);

      const seq = ++loadSeq;
      $('page').classList.add('is-loading');
      let sum, list, count;
      try {
        let res;
        [sum, res] = await Promise.all([
          api('GET', `/api/pours/summary?${query}`),
          // fetch rather than api, for the X-Total-Count header.
          fetch(`/api/pours?${pageQuery}`),
        ]);
        if (!res.ok) throw new Error(res.status);
        list = await res.json();
        count = Number(res.headers.get('X-Total-Count')) || 0;
      } catch (_) {
        if (seq !== loadSeq) return;
        $('page').classList.remove('is-loading');
        $('pageStatus').textContent = 'Could not load the pours. Is the server running?';
        $('results').hidden = true;
        return;
      }
      if (seq !== loadSeq) return; // a newer choice has already been made
      // A delete can leave the page past the end; step back to the last one.
      if (!list.length && view.page > 1) {
        const last = Math.max(1, Math.ceil(count / PAGE_SIZE));
        history.replaceState(null, '', '#' + new URLSearchParams({
          ...Object.fromEntries(new URLSearchParams(location.hash.slice(1))), page: last }));
        return show();
      }
      summary = sum;
      pours = list;
      total = count;
      $('page').classList.remove('is-loading');
      $('pageStatus').textContent = '';
      $('results').hidden = false;
      renderFilters(view);
      renderSummary(view);
      renderTable();
    }

    // ── Controls ────────────────────────────────────
    $('rangeChoice').addEventListener('click', e => {
      const b = e.target.closest('.button');
      if (b && leaveOk()) setHash({ range: b.dataset.value });
    });
    $('beerFilter').addEventListener('change', e => {
      const v = e.target.value;
      if (!leaveOk()) { renderFilters(readHash()); return; }
      setHash({ beer: v === '' ? null : v === NONE_OPTION ? '' : v.slice(2) });
    });
    $('scaleFilter').addEventListener('change', e => {
      if (!leaveOk()) { renderFilters(readHash()); return; }
      setHash({ keg: e.target.value });
    });
    $('newerBtn').addEventListener('click', () => {
      if (leaveOk()) setHash({ page: readHash().page - 1 });
    });
    $('olderBtn').addEventListener('click', () => {
      if (leaveOk()) setHash({ page: readHash().page + 1 });
    });

    $('editBtn').addEventListener('click', () => { editing = true; renderTable(); });
    $('doneBtn').addEventListener('click', () => {
      if (!leaveOk()) return;
      editing = false;
      renderTable();
    });
    $('discardBtn').addEventListener('click', () => renderTable());

    $('poursBody').addEventListener('input', updateEditBar);
    $('poursBody').addEventListener('change', e => {
      if (e.target.type === 'checkbox') toggleSelected(e.target);
      updateEditBar();
    });

    $('saveBtn').addEventListener('click', async () => {
      const { edits, invalid } = collectEdits();
      if (!edits.length || invalid) return;
      $('saveBtn').disabled = true;
      try {
        await api('PATCH', '/api/pours', { pours: edits });
        showToast(edits.length === 1 ? 'Pour saved' : `${edits.length} pours saved`, 'success');
      } catch (err) {
        showToast('Could not save: ' + err.message, 'danger');
        updateEditBar();
        return;
      }
      show();
    });

    $('deleteBtn').addEventListener('click', async () => {
      const ids = [...selected];
      if (!ids.length) return;
      const what = ids.length === 1 ? 'this pour' : `these ${ids.length} pours`;
      if (!confirm(`Delete ${what}? They are removed everywhere, including History. It cannot be undone.`)) return;
      try {
        const { deleted } = await api('DELETE', '/api/pours', { ids });
        showToast(deleted === 1 ? 'Pour deleted' : `${deleted} pours deleted`, 'success');
      } catch (err) {
        showToast('Could not delete: ' + err.message, 'danger');
        return;
      }
      show();
    });

    window.addEventListener('beforeunload', e => {
      if (hasUnsaved()) e.preventDefault();
    });
    window.addEventListener('hashchange', show);

    async function init() {
      const tf = await api('GET', '/api/config').catch(() => ({}));
      timeFormat = tf.time_format || '12h';
      show();
    }

    init();
  </script>
</body>
</html>
