services:
  open-plaato-keg:
    image: ghcr.io/matt-freed/open-plaato-keg:latest
    container_name: open-plaato-keg
    restart: unless-stopped
    ports:
      # Point your Plaato Keg's "host" and "port" at 1234 on this machine.
      - "1234:1234"
      # Web UI and REST API.
      - "8085:8085"
    volumes:
      # The database and uploaded images live here. Without this volume every
      # container update starts from an empty database.
      - ./data:/db
    environment:
      DATABASE_FILE_PATH: /db/open-plaato-keg.db
      KEG_LISTENER_PORT: "1234"
      HTTP_LISTENER_PORT: "8085"
      # BARHELPER_ENABLED: "true"
      # BARHELPER_API_KEY: your-barhelper-api-key
      # BARHELPER_KEG_MONITOR_MAPPING: "<plaato-auth-token>:<barhelper-monitor-id>"
